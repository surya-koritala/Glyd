[workspace]
members = ["crates/starlings-protocol", "crates/starlings-core", "crates/starlings-adapters", "crates/starlings-cli", "crates/starlings-security"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"
repository = "https://github.com/surya-koritala/Glyd"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
starlings-core = { version = "0.1.0", path = "crates/starlings-core" }
starlings-protocol = { version = "0.1.0", path = "crates/starlings-protocol" }
starlings-adapters = { version = "0.1.0", path = "crates/starlings-adapters", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
serde_json_canonicalizer = "0.3.2"
jsonschema = { version = "0.58.6", default-features = false }
uuid = { version = "1", default-features = false }
time = { version = "0.3", features = ["parsing"] }
