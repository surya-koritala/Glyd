# The workspace is unpublished and its own license remains undecided.
[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0", "Zlib", "0BSD", "MIT-0", "MPL-2.0"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# Reviewed artifact-access dependencies; no blanket exception for future packages.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.10"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "winx"
version = "=0.36.4"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
# Transitive versions are locked; inspect duplicates during dependency updates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
