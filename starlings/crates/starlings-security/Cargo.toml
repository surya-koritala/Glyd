[package]
name = "starlings-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
starlings-protocol.workspace = true
starlings-core.workspace = true
httparse = "1.10.1"
interprocess = { version = "2.4.5", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
x509-parser = "0.18.1"
private-fs = "0.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }

socket2 = "0.6.5"
if-addrs = { version = "0.15.0", features = ["link-local"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
cap-std = "4.0"

[dev-dependencies]
starlings-adapters.workspace = true
tempfile = "3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
