[package]
name = "starlings-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
repository = "https://github.com/surya-koritala/Glyd"
license = "Apache-2.0"

# (not the root's [workspace.lints]: Starlings forbids unsafe code and is clean under clippy's defaults with -D warnings, which the root's allow-list is not for)
[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_json_canonicalizer.workspace = true
jsonschema.workspace = true
uuid.workspace = true
time.workspace = true
