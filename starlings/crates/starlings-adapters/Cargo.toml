[package]
name = "starlings-adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
repository = "https://github.com/surya-koritala/Glyd"
license = "Apache-2.0"

[[example]]
name = "service_check"
test = true

[features]
test-backend = ["dep:starlings-core"]

# (not the root's [workspace.lints]: Starlings forbids unsafe code and is clean under clippy's defaults with -D warnings, which the root's allow-list is not for)
[lints.rust]
unsafe_code = "forbid"

[dependencies]
starlings-core = { workspace = true, optional = true }
starlings-protocol.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
nvml-wrapper = { version = "=0.13.0", default-features = false }

sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk", "component"] }
ureq = { version = "3.4.2", default-features = false }

time = { workspace = true, features = ["formatting"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
