[package]
name = "starlings-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
repository = "https://github.com/surya-koritala/Glyd"
license = "Apache-2.0"

[[bin]]
name = "starlings"
path = "src/main.rs"

[features]
default = []
test-backend = ["starlings-adapters/test-backend"]

[dependencies]
starlings-security = { version = "0.1.0", path = "../starlings-security" }
serde.workspace = true
uuid = { workspace = true, features = ["v4"] }
time = { workspace = true, features = ["formatting"] }
dirs = "6.0.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
starlings-protocol.workspace = true
starlings-adapters.workspace = true

mdns-sd = { version = "=0.21.5", default-features = false }
ureq = { version = "3.4.2", default-features = false }
base64 = "0.23.1"
httparse = "1.10.1"

# (not the root's [workspace.lints]: Starlings forbids unsafe code and is clean under clippy's defaults with -D warnings, which the root's allow-list is not for)
[lints.rust]
unsafe_code = "forbid"

[dependencies.starlings-core]
workspace = true

[dependencies.serde_json]
workspace = true

[dev-dependencies]
tempfile = "3"
socket2 = "0.6.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
