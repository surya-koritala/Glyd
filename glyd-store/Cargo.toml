[package]
name = "glyd-store"
version = "0.15.0"
edition = "2021"
description = "A store that compresses across the objects it holds: each object kept as a delta against the stored object it most resembles, small objects in packs, on a directory or S3 (built on the glyd codec)"
repository = "https://github.com/surya-koritala/Glyd"
readme = "README.md"
keywords = ["compression", "storage", "s3", "deduplication", "backup"]
categories = ["compression", "filesystem"]
license = "BUSL-1.1"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "glyd-store"
path = "src/bin/glyd-store.rs"

[dependencies]
glyd = { version = "0.15.0", path = ".." }
hmac = "0.13"
sha2 = "0.11"
ureq = "3"
