[package]
name = "glyd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
glyd-gpu = { path = "../glyd-gpu" }
glyd-engine = { path = "../glyd-engine" }
glyd = { path = "..", default-features = false, features = ["deflate"] }

# Its own workspace: the fuzz crate stays out of the main one, so a normal build or test never pays for libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gguf"
path = "fuzz_targets/gguf.rs"
test = false
doc = false
bench = false

