[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glyd"
version = "0.10.1"
description = "Compression for the data that fills object storage: record mode, packs, a store that compresses across objects, the fastest reads"
readme = "README.md"
license = { text = "Apache-2.0 OR GPL-2.0-only" }
requires-python = ">=3.8"

[tool.setuptools]
packages = ["glyd"]

[tool.setuptools.package-data]
glyd = ["libglyd_store.dylib", "libglyd_store.so", "glyd_store.dll", "libglyd.dylib", "libglyd.so", "glyd.dll"]
