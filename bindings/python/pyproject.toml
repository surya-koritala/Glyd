[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glyd"
version = "0.26.0"
description = "Lossless AI compression: 33% less GPU memory, bit for bit. Models load with their weights packed on the GPU (glyd.from_pretrained); a codec for files and object storage."
keywords = ["compression", "lossless", "llm", "gpu", "cuda", "bfloat16", "transformers", "pytorch", "object-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
readme = "README.md"
# The binding and the codec: BSD-3-Clause or GPL-2.0; the bundled
# libglyd_store (the Store class): BUSL-1.1, see LICENSE-glyd-store.
# (The weights on the GPU are the glyd-gpu package, BUSL-1.1.)
license = { text = "BSD-3-Clause OR GPL-2.0-only; bundled libglyd_store BUSL-1.1" }
requires-python = ">=3.8"

[project.urls]
Homepage = "https://getglyd.com"
Documentation = "https://getglyd.com/docs/"
Source = "https://github.com/surya-koritala/Glyd"
Changelog = "https://getglyd.com/changelog/"
Issues = "https://github.com/surya-koritala/Glyd/issues"

[project.optional-dependencies]
# The GPU half is the glyd-gpu package (compiled wheels, the same version as this one): gpu, for glyd.from_pretrained and glyd.fit; vllm,
# for vllm serve MODEL --quantization glyd and glyd run (glyd-gpu's own extra holds the vLLM release it is tested with).
gpu = ["glyd-gpu==0.26.0"]
vllm = ["glyd-gpu[vllm]==0.26.0"]

[project.scripts]
# glyd run / serve / doctor / login / pack / verify go to glyd-gpu; any other command to the compression program (the Rust glyd), found on PATH
glyd = "glyd.cli:main"

[tool.setuptools]
packages = ["glyd", "glyd.gpu"]
license-files = ["LICENSE", "COPYING", "LICENSE-glyd-store"]

[tool.setuptools.package-data]
glyd = ["libglyd_store.dylib", "libglyd_store.so", "glyd_store.dll", "libglyd.dylib", "libglyd.so", "glyd.dll"]
