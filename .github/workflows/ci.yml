name: CI

# The tests that need no GPU, on every push to main and every pull request (and by hand: gh workflow run ci.yml --ref BRANCH):
# the version files, glyd_gpu's tests as Python sources and as the compiled wheel it ships (the same tests: Cython changes what a
# module is), the vLLM plugin's with vLLM installed, the Rust crate, and the engine's (its tests as a development build and as the release build, the strings
# of the release build's sources, the Rust glyd's hand-off), and the Rust workspace compiled and unit-tested on Windows x86_64 and macOS arm64 (no
# kernels, no GPU; on a pull request only when it changes code near something that differs between systems, and the engine's release build there on main only). The wheels' own build, with the CUDA libraries and the engine, and their
# publishing are release.yml's. A newer push to a pull request stops its older run.
# The Rust jobs build with `--profile ci` (Cargo.toml: the release build's code without fat LTO). On GitHub's machines they keep their build in Swatinem/rust-cache, saved from
# main's runs; on the PC (CI_RUNNER) in a build directory of the runner's own (.github/actions/pc-job), so GitHub's 10 GB cache holds the Windows, macOS and arm builds.
# A run on main or by hand always runs to the end, each in its own group: release.yml needs CI's success on a release's exact commit.
# The check to require on main is `CI result` (the last job): it passes when every job above succeeded or was skipped, which is what a pull request that changes only docs gets.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'benchmarks/**', 'research/**', 'ibis/**', 'starlings/**', 'cards/**', 'tools/**']
  # (no paths-ignore here: a required check must report on every pull request, so the `changes` job decides and the jobs it gates are skipped; `CI result` is the one check to require)
  pull_request:
    branches: [main]
  # (the merge queue: each queued pull request is tested on top of main and the pull requests ahead of it, before it lands)
  merge_group:
  # (nightly: everything, the Windows and macOS jobs included, which a pull request runs only when it touches code that differs between systems)
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # the build tools the wheels are made with (release.yml has the same)
  BUILD_TOOLS: "build==1.6.1 wheel==0.48.0 setuptools==84.0.0 Cython==3.3.0"

jobs:
  # The codec and store (the root crate and glyd-store): their tests, the regression floors, the C ABI and a CLI round trip.
  # Its name is the required check on main.
  codec:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (as below)
    timeout-minutes: 45
    env:
      # the codec's release builds target x86-64-v3 (AVX2), as its benchmarks do
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
        with:
          keep-target: codec
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # (GitHub's machines only: on the PC target/ is kept by pc-job)
        if: runner.environment == 'github-hosted'
        with:
          shared-key: codec
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v6
        with:
          path: corpus
          key: corpus-${{ hashFiles('scripts/download_corpus.sh') }}
      - run: bash scripts/download_corpus.sh
      - run: cargo test --profile ci --all-targets -p glyd -p glyd-store
      - run: cargo test --profile ci -p glyd --test regression_floors -- --nocapture
      - name: C ABI
        run: |
          cargo build --profile ci -p glyd --lib
          cc -O2 -o target/c_abi tests/test_c_abi.c -Ltarget/ci -lglyd -Wl,-rpath,$PWD/target/ci
          ./target/c_abi
      - name: CLI round trip and corruption
        run: |
          cargo build --profile ci -p glyd --bin glyd
          head -c 3000000 corpus/dickens > /tmp/sample.bin
          GLYD_BIN=target/ci/glyd scripts/verify_roundtrip.sh /tmp/sample.bin

  # Which of the platform jobs a change needs: a pull request that touches no Rust code (workflows other than this one, scripts, Python, benchmarks) skips them.
  # A skipped job counts as passed for a required check, which a path filter on the whole workflow would not. A push to main and a manual run always build.
  changes:
    name: Rust code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      versions: ${{ steps.diff.outputs.versions }}
      platforms: ${{ steps.diff.outputs.platforms }}
      rust: ${{ steps.diff.outputs.rust }}
      hip: ${{ steps.diff.outputs.hip }}
      starlings: ${{ steps.diff.outputs.starlings }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PLATFORMS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'platforms') }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # (the pull request's merge commit against its first parent, the base)
              base=HEAD^1
              git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed" ;;
            merge_group)
              # (the queue's commit against the main it is built on: what this entry and the ones ahead of it change)
              git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
              base="$QUEUE_BASE"
              git diff --no-renames --name-only "$QUEUE_BASE" HEAD > "$RUNNER_TEMP/changed" ;;
            *)
              {
                echo "code=true"
                echo "versions=true"
                echo "rust=true"
                echo "hip=true"
                echo "platforms=true"
                echo "starlings=true"
                echo "workflows=true"
              } >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          cat "$RUNNER_TEMP/changed"
          code=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml) code=true ;;
              *.md | docs/* | benchmarks/* | research/* | ibis/* | starlings/* | cards/* | tools/* | .github/workflows/*) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # (a workflow file or an action: actionlint reads them all)
          if grep -Eq '^\.github/(workflows|actions)/' "$RUNNER_TEMP/changed"; then echo "workflows=true" >> "$GITHUB_OUTPUT"; else echo "workflows=false" >> "$GITHUB_OUTPUT"; fi
          # (the Versions agree job also runs tools/report/report.py's self-test)
          if [ "$code" = true ] || grep -Eq '^tools/report/' "$RUNNER_TEMP/changed"; then
            echo "versions=true" >> "$GITHUB_OUTPUT"
          else
            echo "versions=false" >> "$GITHUB_OUTPUT"
          fi
          # Windows and macOS: a pull request runs them when it carries the `platforms` label, changes a manifest, a build script, the checkout rules or this workflow, or changes
          # Rust lines within 15 of code for one system (cfg on windows, unix or target_os, or std::os::unix/windows). The rest is the same on every system and is tested on Linux;
          # main and the nightly run build everything, and a failure there opens an issue.
          platforms=false
          [ "$PLATFORMS_LABEL" = true ] && platforms=true
          if grep -Eq '(^|/)(Cargo\.toml|Cargo\.lock|build\.rs|rust-toolchain\.toml)$|^\.gitattributes$|^\.github/workflows/ci\.yml$|^src/mmap' "$RUNNER_TEMP/changed"; then
            platforms=true
          fi
          if git diff --no-renames -U15 "$base" HEAD -- '*.rs' | grep -E '^[ +-]' | grep -Eq 'cfg\(.*(windows|unix|target_os)|cfg!\(.*(windows|unix|target_os)|std::os::(unix|windows)'; then
            platforms=true
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          if grep -Eq '^(Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|src/|glyd-(store|gpu|engine)/|third_party/|include/|tests/|examples/|\.github/workflows/ci\.yml|\.github/actions/)' "$RUNNER_TEMP/changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # Starlings: its crates and fuzz target, and what every member of the workspace shares (the lock file, the toolchain, the dependency policy, this workflow).
          if grep -Eq '^(starlings/|Cargo\.(toml|lock)|rust-toolchain\.toml|deny\.toml|\.github/workflows/ci\.yml)' "$RUNNER_TEMP/changed"; then
            echo "starlings=true" >> "$GITHUB_OUTPUT"
          else
            echo "starlings=false" >> "$GITHUB_OUTPUT"
          fi
          # The AMD build: the kernels, their HIP header, the build script and the engine's sources that have a HIP form (cfg glyd_hip), the lock file and this workflow.
          if grep -Eq '^(glyd-engine/(kernels/|build\.rs|Cargo\.toml|src/)|glyd-gpu/|gpu/hip\.h|Cargo\.lock|\.github/workflows/ci\.yml)' "$RUNNER_TEMP/changed"; then
            echo "hip=true" >> "$GITHUB_OUTPUT"
          else
            echo "hip=false" >> "$GITHUB_OUTPUT"
          fi

  # The codec, the store, glyd-gpu's host code and the engine without its kernels (no nvcc: the CUDA paths report that the build has none), built and unit-tested
  # on the systems the engine does not run on (and on aarch64 Linux, where it has not run a model yet), so that a change that stops them compiling or linking is caught before a release is planned. GitHub's own machines
  # always (CI_RUNNER is for the Linux jobs); the target directory and the registry are cached by Cargo.lock.
  # The names are the required checks.
  platform:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 compile & test (codec, store, CLI)
            os: windows-latest
            part: codec
          - name: Windows x86_64 compile & test (engine)
            os: windows-latest
            part: engine
          # (aarch64 Linux, the architecture of GH200, GB200, DGX Spark and Jetson: GitHub's free arm runners have no GPU, so this is the build and the host-side tests, not a run on a GPU; machine.rs's ARCHS_BUILT)
          - name: Linux aarch64 compile & test (codec, store, CLI)
            os: ubuntu-24.04-arm
            part: codec
          - name: Linux aarch64 compile & test (engine)
            os: ubuntu-24.04-arm
            part: engine
          - name: macOS arm64 compile & test (codec, store, CLI)
            os: macos-latest
            part: codec
          - name: macOS arm64 compile & test (engine)
            os: macos-latest
            part: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: platform-${{ matrix.os }}-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the CLI and the store
        if: matrix.part == 'codec'
        shell: bash
        run: cargo build --profile ci -p glyd --bin glyd && cargo build --profile ci -p glyd-store
      - name: Unit tests of the codec, the store and glyd-gpu
        if: matrix.part == 'codec'
        timeout-minutes: 15
        shell: bash
        run: cargo test --profile ci -p glyd -p glyd-store -p glyd-gpu --lib --bins
      - name: CLI round trip
        if: matrix.part == 'codec'
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          cat Cargo.lock Cargo.lock src/*.rs > "$RUNNER_TEMP/in.bin"
          for level in -1 -9 ""; do
            target/ci/glyd$exe $level -c "$RUNNER_TEMP/in.bin" -o "$RUNNER_TEMP/in.glyd"
            target/ci/glyd$exe -d "$RUNNER_TEMP/in.glyd" -o "$RUNNER_TEMP/out.bin"
            cmp "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/out.bin"
          done
      # (the build of the tests and then the tests: a hosted macOS machine took 7.5 minutes to build them and over 12 to run 1,236 of the 1,256 unit tests)
      - name: The engine's tests (the development build)
        if: matrix.part == 'engine'
        timeout-minutes: 50
        shell: bash
        run: cargo test --profile ci -p glyd-engine
      - name: The engine program runs
        if: matrix.part != 'codec'
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          target/ci/glyd-engine$exe --version

  # The Rust workspace on its minimum Rust (rust-version in every manifest): what compiles on 1.89 and no newer.
  # The engine's release build (--no-default-features) on Windows, aarch64 Linux and macOS: on main, nightly and by hand. A pull request does not run it (its development build
  # above, and the release build on Linux, are the same code but for the development features); a failure on main opens an issue (platform-failed).
  platform-release:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 compile & test (engine, release build)
            os: windows-latest
          - name: Linux aarch64 compile & test (engine, release build)
            os: ubuntu-24.04-arm
          - name: macOS arm64 compile & test (engine, release build)
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: platform-${{ matrix.os }}-engine-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The engine's tests (the release build)
        timeout-minutes: 20
        shell: bash
        run: cargo test --profile ci -p glyd-engine --no-default-features
      - name: The engine program runs
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          target/ci/glyd-engine$exe --version

  msrv:
    name: Minimum Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # (rust-toolchain.toml pins the toolchain of the other jobs; this one asks for the minimum)
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # (Starlings' crates declare rust-version 1.97.1, the pinned toolchain: the other jobs build them)
      - run: cargo check --workspace --exclude 'starlings-*' --all-targets

  # The AMD build of the engine's kernels (GLYD_HIP=1: kernels/engine.cu by hipcc for RDNA 3 and 4, and the engine's Rust under cfg glyd_hip), compiled and not run:
  # GitHub's machines have no AMD GPU, and ROCm's compiler from AMD's apt repository is all the build needs.
  hip:
    name: HIP kernels compile (AMD)
    needs: changes
    if: needs.changes.outputs.hip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GLYD_HIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A compile that passed is remembered by the content of everything it reads: the same files again (a rerun, a push that changed nothing the AMD build reads) skip
      # the install and the build, and the job passes. (A cache of hipcc's output through cargo did not work: cargo rebuilt the engine's crate, and hipcc, whatever the file times.)
      - id: memo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5, Node 24
        with:
          path: ${{ runner.temp }}/hip-compiled
          key: hip-compiled-${{ hashFiles('glyd-engine/kernels/**', 'glyd-engine/build.rs', 'glyd-engine/Cargo.toml', 'glyd-engine/src/**', 'glyd-gpu/**', 'gpu/hip.h', 'gpu/glyd_gpu_kernels.h', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}
      # hipcc's bundle of code objects, by the content of what it compiles (the kernels, their HIP header, the build script that says how): a change to the engine's Rust code
      # alone builds the crate against the bundle of an earlier compile (scripts/ci_hipcc_cache.sh), with no ROCm install and no kernel compile.
      - id: bundle
        if: steps.memo.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5, Node 24
        with:
          path: ${{ runner.temp }}/hip-bundle
          key: hip-bundle-7.2.1-${{ hashFiles('glyd-engine/kernels/**', 'glyd-engine/build.rs', 'gpu/hip.h', 'gpu/glyd_gpu_kernels.h') }}
      - if: steps.memo.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - if: steps.memo.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: hip
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: ROCm 7.2.1's HIP compiler
        if: steps.memo.outputs.cache-hit != 'true' && steps.bundle.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://repo.radeon.com/rocm/rocm.gpg.key -o "$RUNNER_TEMP/rocm.gpg.key"
          echo "2de99e2354646a90d9903e2a669fc4e36b02c1bbff7075c481e12d7edab2c88b  $RUNNER_TEMP/rocm.gpg.key" | sha256sum --check
          sudo mkdir -p /etc/apt/keyrings
          gpg --dearmor < "$RUNNER_TEMP/rocm.gpg.key" | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.1 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # (Ubuntu has a hipcc of its own with a higher version number, 5.7: ROCm's packages are preferred)
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/rocm-pin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hip-dev rocm-device-libs
          rocm=$(dirname "$(dirname "$(ls /opt/rocm*/bin/hipcc | head -1)")")
          echo "ROCM_PATH=$rocm" >> "$GITHUB_ENV"
          echo "HIPCC=$rocm/bin/hipcc" >> "$GITHUB_ENV"
          "$rocm/bin/hipcc" --version
      - if: steps.memo.outputs.cache-hit != 'true'
        env:
          HIP_BUNDLE_DIR: ${{ runner.temp }}/hip-bundle
        run: |
          export HIP_REAL="${HIPCC:-}"
          export HIPCC="$PWD/scripts/ci_hipcc_cache.sh"
          cargo build --profile ci -p glyd-engine
      - if: steps.memo.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/hip-compiled" && date -u > "$RUNNER_TEMP/hip-compiled/at"

  # rustfmt, clippy with warnings denied (both feature sets of the engine), and the dependency policy (deny.toml).
  # Clippy's findings from before the baseline are allowed by name in Cargo.toml's [workspace.lints.clippy].
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (as below)
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
        with:
          keep-target: lint
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # (GitHub's machines only: on the PC target/ is kept by pc-job)
        if: runner.environment == 'github-hosted'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p glyd-engine --no-default-features --all-targets -- -D warnings
      - name: Dependency policy
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" --locked check

  versions:
    name: Versions agree
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (CI_RUNNER '["self-hosted","glyd-pc"]': the owner's PC, never for a fork's pull request; unset: GitHub's)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
      # (cargo xtask: the repository's own tasks, the standard library only, built here in seconds)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      # One version in Cargo's spelling (0.27.0-rc.1) and Python's (0.27.0rc1), in every file that has it
      - run: |
          bash -n gpu/vllm/acceptance.sh
          cargo xtask bump-version --check
          cargo test --locked -p xtask
          python3 tools/report/report.py --selftest
          bash scripts/check_install_verify.sh

  rust:
    name: The Rust glyd-gpu crate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (CI_RUNNER '["self-hosted","glyd-pc"]': the owner's PC, never for a fork's pull request; unset: GitHub's)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
        with:
          keep-target: gpu
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # (GitHub's machines only: on the PC target/ is kept by pc-job)
        if: runner.environment == 'github-hosted'
        with:
          shared-key: gpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --profile ci --all-targets -p glyd-gpu

  engine:
    # glyd-engine (glyd-engine/) as a development build (the default features; the release build is the next job): its host-side tests, with no nvcc (the crate
    # is built without its kernels); and the Rust glyd's hand-off of glyd run and glyd serve to the engine or the Python tool.
    name: The Rust engine (tests, the Rust glyd's hand-off)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (CI_RUNNER '["self-hosted","glyd-pc"]': the owner's PC, never for a fork's pull request; unset: GitHub's)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
        with:
          keep-target: engine
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # (GitHub's machines only: on the PC target/ is kept by pc-job)
        if: runner.environment == 'github-hosted'
        with:
          shared-key: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The engine's tests (the development build)
        run: cargo test --profile ci -p glyd-engine
      # (the tests #[ignore]d for their minutes that hold a rule, a random test model's noise floor at most a tenth of the kind's bound and the two references' agreement: the `run` lines of
      # glyd-engine/tests/ignored-in-gate.txt, the one list; scripts/check_tree.sh fails on an ignored test that is on neither list)
      - name: The engine's ignored tests that hold a rule (the noise floors, the references' agreement)
        timeout-minutes: 20
        run: bash scripts/test_ignored.sh
      # (R10: each saved checkpoint of tests/data/packs, every pack format Glyd has written, read as its readers read it and run on the CPU reference of the layer kinds, its
      # logits against the digest recorded for it in glyd-engine/tests/packs; the unit test above holds the same, this prints a line for each format)
      - name: Every pack format loads to its recorded logits on the CPU (src/packcheck.rs)
        run: cargo run --profile ci -q -p glyd-engine -- packcheck
      - name: The Rust glyd's hand-off (the engine, the Python tool, GLYD_ENGINE=0)
        run: cargo test --profile ci -p glyd --test cli_python_tool

  # The engine's release build (--no-default-features), in a job of its own so that the two builds of the crate run side by side.
  engine-release:
    name: The Rust engine, release build (tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (as above)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
        with:
          keep-target: engine-release
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # (GitHub's machines only: on the PC target/ is kept by pc-job)
        if: runner.environment == 'github-hosted'
        with:
          shared-key: engine-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --profile ci -p glyd-engine --no-default-features

  # Starlings (starlings/crates, members of this workspace; edition 2024, rustfmt defaults from starlings/rustfmt.toml): formatting (its fuzz crate too), clippy, the tests on Linux x86_64 and the
  # dependency policy of the whole workspace and of the fuzz crate. Runs when starlings/ or something every crate shares changes. Every OS, the Windows partitions and the daemon lifecycle
  # run nightly and on a pull request labeled full-ci (starlings-ci.yml).
  starlings:
    name: Starlings (tests, lint, dependency policy)
    needs: changes
    if: needs.changes.outputs.starlings == 'true'
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (as above)
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pc-job
      - name: Private home and temp folder on the PC
        if: runner.environment == 'self-hosted'
        run: |
          # (Starlings' tests refuse a directory to create in that is not the runner's own or is writable by its group or others, and the PC's runners may have a umask of 002: everything
          # here is 0700 and the runner's. TMPDIR is short because systemd-analyze binds sockets under it and a Unix socket path is at most 108 bytes; Ubuntu's spice-vdagent user unit has a bad
          # key that fails its unit-file check, so it is masked for the job.)
          was=$(umask)
          umask 077
          mkdir -p "$HOME/.config/systemd/user"
          ln -sf /dev/null "$HOME/.config/systemd/user/spice-vdagent.service"
          tmp=$(mktemp -d /tmp/starlings-ci.XXXXXX)
          chmod 700 "$HOME" "$HOME/.config" "$HOME/.config/systemd" "$HOME/.config/systemd/user" "$tmp" "$RUNNER_TEMP/job-cache"
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
          echo "user $(id -un) uid $(id -u), the runner's umask $was:"; stat -c '%A %U %n' "$HOME" "$tmp" /tmp "$RUNNER_TEMP"
      - run: git config --global init.defaultBranch main
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: starlings
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency policy
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          deny="$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny"
          "$deny" --workspace --locked check --deny warnings
          "$deny" --manifest-path starlings/fuzz/Cargo.toml --config starlings/fuzz/deny.toml --locked check --deny warnings
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path starlings/fuzz/Cargo.toml --all -- --check
      - name: Lint (default features, then every feature)
        run: |
          cargo clippy -p 'starlings-*' --all-targets --locked -- -D warnings
          cargo clippy -p 'starlings-*' --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: |
          umask 077  # (the directories the tests make are private whatever the runner's umask)
          cargo test -p 'starlings-*' --locked -- --nocapture
      - name: Tests with every feature (the development backend), the daemon with the stand-in engine
        run: |
          umask 077
          cargo test -p starlings-cli -p starlings-adapters --all-features --lib --bins --test cli --locked -- --nocapture
          cargo test -p starlings-cli --all-features --test daemon catalog_service_ --locked -- --nocapture
          cargo test -p starlings-cli --all-features --test daemon pipeline_fake_engine --locked -- --nocapture

  # The workflow files parse and their expressions are right (actionlint, pinned and checked): a broken file in .github/workflows breaks the workflow that has it, and
  # nothing else notices (the GPU workflows do not run on a pull request without their label). Runs when a workflow or action changes, and on main.
  workflows:
    name: Workflow files (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # (the syntax and the expressions; the shell and Python style checks of the scripts inside are off)
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -color

  # The one check to require on main: it waits for every job above, and passes when each succeeded or was skipped (a pull request that changes only docs skips the
  # heavy ones, so it reports in seconds), and fails when one failed or was cancelled.
  result:
    name: CI result
    if: always()
    needs: [changes, codec, lint, versions, rust, engine, engine-release, platform, platform-release, msrv, hip, starlings, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a job failed or was cancelled"; exit 1 ;;
          esac

  # A Windows or macOS job that fails on main (a push or the nightly run) opens an issue (or adds to the one already open), so that breakage after a merge is seen:
  # a pull request skips those jobs unless it touches code that differs between systems.
  platform-failed:
    name: Platform failure on main
    needs: [platform, platform-release]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.platform.result == 'failure' || needs.platform-release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Windows or macOS CI failed on main"
          body="A Windows or macOS job failed on main at ${SHA:0:10}: $RUN_URL (a pull request runs those jobs only when it changes code that differs between systems, so a break can land after a merge)."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "area: ci" --body "$body"
          fi
