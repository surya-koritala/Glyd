# Every commit in a pull request must carry a Signed-off-by trailer,
# which accepts CLA.md.
name: CLA
on:
  pull_request:
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          missing=$(git log --format='%H %s%n%b' --no-merges \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk '/^[0-9a-f]{40} /{if(h!="" && !ok) print h; h=$1; ok=0} /^Signed-off-by: /{ok=1} END{if(h!="" && !ok) print h}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (git commit -s; see CLA.md):"
            echo "$missing"
            exit 1
          fi
