# Every commit in a pull request must carry a Signed-off-by trailer,
# certifying the Developer Certificate of Origin (DCO).
name: DCO
on:
  pull_request:
  # (the merge queue: the commits of the entries in the group, which the pull requests' own runs checked one by one)
  merge_group:
# a pull request's older run is cancelled by its newer one; any other run is a group of its own, so none is cancelled or held back (as ci.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          missing=$(git log --format='%H %s%n%b' --no-merges "$BASE..$HEAD" \
            | awk '/^[0-9a-f]{40} /{if(h!="" && !ok) print h; h=$1; ok=0} /^Signed-off-by: /{ok=1} END{if(h!="" && !ok) print h}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (git commit -s; see DCO and CONTRIBUTING.md):"
            echo "$missing"
            exit 1
          fi
