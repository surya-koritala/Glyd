name: Quantization benchmark preparation
on:
  workflow_dispatch:
    inputs:
      model_key:
        description: Pinned entry in the benchmark model registry
        type: string
        default: qwen38-27b
      profile:
        description: Frozen evaluation profile
        type: choice
        options: [screen, full]
        default: screen
      arm_bundle:
        description: Package the original screen inputs with the current scorer and retained BF16/FP8 arms
        type: boolean
        default: false
  pull_request:
    paths:
      - 'research/quant-benchmark/**'
      - 'research/candidate-a-gpu/a7_variant.py'
      - '.github/workflows/quant-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: quant-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Evidence identity and decision regressions
        run: |
          python -m pip install 'scipy==1.18.1'
          python research/quant-benchmark/test_protocol.py
          python -m compileall -q research/quant-benchmark
          bash -n research/quant-benchmark/build_prepared.sh research/quant-benchmark/pod_environment.sh research/quant-benchmark/pod_job.sh research/quant-benchmark/pod_job_arm.sh
      - name: e3m3 transform against an independent nearest-value search
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python research/quant-benchmark/check_e3m3.py
  arm-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.arm_bundle
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original prepared inputs, current scorer and retained reference arms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The screen bundle the BF16, FP8 and Candidate A baseline ran from (CI run 37621438332).
          gh run download 37621438332 -R "$GITHUB_REPOSITORY" -n quant-benchmark-prepared -D /tmp/original
          echo "2d2351c99f596edb1aaf2a985ae0c2894d2160f65c0978b33a2afa56a19fe325  /tmp/original/quant-benchmark.tar" | sha256sum -c
          mkdir /tmp/bundle && tar -xf /tmp/original/quant-benchmark.tar -C /tmp/bundle
          (cd /tmp/bundle && sha256sum -c --quiet SHA256SUMS)
          rm -rf /tmp/bundle/research/quant-benchmark
          cp -r research/quant-benchmark /tmp/bundle/research/
          cp research/lossy-2026/matched_quality.py /tmp/bundle/research/lossy-2026/
          for arm in bf16 fp8; do
            mkdir -p /tmp/bundle/references/$arm
            cp benchmarks/weights/quant-core-qwen38-2026-10-07/$arm/header.json benchmarks/weights/quant-core-qwen38-2026-10-07/$arm/samples.jsonl /tmp/bundle/references/$arm/
            python3 -c 'import hashlib,json,sys; h=json.load(open(sys.argv[1]+"/header.json")); d=hashlib.sha256(open(sys.argv[1]+"/samples.jsonl","rb").read()).hexdigest(); assert h["complete"] and d==h["samples_sha256"], sys.argv[1]' /tmp/bundle/references/$arm
          done
          printf '%s\n' "$GITHUB_SHA" > /tmp/bundle/CODE_COMMIT
          cd /tmp/bundle
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c --quiet SHA256SUMS
          tar -cf /tmp/quant-arm.tar .
          cd /tmp && sha256sum quant-arm.tar > quant-arm.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: quant-arm-prepared
          path: |
            /tmp/quant-arm.tar
            /tmp/quant-arm.tar.sha256
          compression-level: 0
          retention-days: 14
  prepare:
    if: ${{ !inputs.arm_bundle }}
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_KEY: ${{ inputs.model_key || 'qwen38-27b' }}
      PROFILE: ${{ inputs.profile || 'screen' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze inputs and verify the exact offline pod environment
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p "$RUNNER_TEMP/quant-benchmark"
          IMAGE=$(cat research/lossy-2026/pod-image.txt)
          docker run --rm --entrypoint /bin/bash -e GITHUB_SHA -e MODEL_KEY -e PROFILE \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/quant-benchmark:/out" "$IMAGE" \
            -c 'bash /source/research/quant-benchmark/build_prepared.sh /source /out "$MODEL_KEY" "$PROFILE"' \
            > "$RUNNER_TEMP/quant-benchmark/preparation.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quant-benchmark-prepared
          path: |
            ${{ runner.temp }}/quant-benchmark/quant-benchmark.tar
            ${{ runner.temp }}/quant-benchmark/quant-benchmark.tar.sha256
            ${{ runner.temp }}/quant-benchmark/preparation-summary.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-benchmark-preparation-log
          path: ${{ runner.temp }}/quant-benchmark/preparation.log
          retention-days: 14
