name: Lossy 27B quality preparation
on:
  workflow_dispatch:  # (research of Oct 7-10, run by hand: on every pull request it took a fifth of the org's Actions minutes, and Candidate A's 2 GB uploads most of its storage)
permissions:
  contents: read
concurrency:
  group: lossy27-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Protocol and shell checks
        run: |
          python3 research/lossy-2026/test_quality.py
          bash -n research/lossy-2026/quality_job.sh research/lossy-2026/quality_env.sh research/lossy-2026/build_quality.sh research/lossy-2026/quality_match_job.sh
          python3 -m py_compile research/lossy-2026/quality_reference.py research/lossy-2026/quality_env.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Freeze held-out evaluation inputs
        run: |
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0' 'torchvision==0.23.0'
          python3 -m pip install 'transformers==5.18.0' 'pyarrow==23.0.1' 'accelerate==1.12.0' 'huggingface_hub==1.31.0' 'safetensors==0.8.0' 'hf_xet==1.5.2'
          python3 -c 'from transformers import Qwen3_5ForConditionalGeneration; import inspect; print(inspect.signature(Qwen3_5ForConditionalGeneration.forward))'
          cargo build --release --manifest-path research/lossy-2026/rust/Cargo.toml --bin glyd-lossy-inventory
          python3 research/lossy-2026/check_matched.py research/lossy-2026/rust/target/release/glyd-lossy-inventory
          python3 research/lossy-2026/prepare_quality.py --windows 32 --length 1024 --prefix 512 --out /tmp/evaluation
          python3 research/lossy-2026/prepare_fp8_reference.py --out /tmp/evaluation/reference-audit.json
      - name: Calibrated pack (GLY-123), a tiny Qwen3.5 end to end (calib.py, plan.py, glyd-gpu pack --codes, verify)
        run: python3 research/lossy-2026/test_calib_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: lossy27-quality-evaluation
          path: /tmp/evaluation/
          retention-days: 14
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reference bootstrap in the exact pod image
        shell: bash
        run: |
          # Make room for the CUDA image on the disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p "$RUNNER_TEMP/quality-env"
          IMAGE=$(cat research/lossy-2026/pod-image.txt)
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD:/study:ro" -v "$RUNNER_TEMP/quality-env:/report" "$IMAGE" -c '
              set -euo pipefail
              # Non-interactive SSH does not preserve the image pip override.
              if env -u PIP_BREAK_SYSTEM_PACKAGES python3.12 -m pip install --dry-run transformers==5.18.0 > /report/system-pip.txt 2>&1; then
                echo "System pip unexpectedly accepted the old bootstrap"; exit 1
              fi
              grep -q externally-managed-environment /report/system-pip.txt
              python3.12 -m pip freeze --all > /report/base-before.txt
              bash /study/research/lossy-2026/quality_env.sh /tmp/quality-reference /report/environment.json
              /tmp/quality-reference/bin/python -c "from transformers import FineGrainedFP8Config; from transformers.integrations.finegrained_fp8 import Fp8Dequantize; assert FineGrainedFP8Config(dequantize=True).dequantize"
              python3.12 -m pip freeze --all > /report/base-after.txt
              cmp /report/base-before.txt /report/base-after.txt
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lossy27-quality-environment
          path: ${{ runner.temp }}/quality-env/
          retention-days: 14
  binaries:
    needs: environment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: nvidia/cuda:13.0.3-devel-rockylinux8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build prerequisites
        run: dnf install -y -q --disablerepo='cuda*' --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils python3 perl-core
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Host regressions and A100 binaries
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-13/enable
          bash research/lossy-2026/build_quality.sh /tmp/lossy27-bin
      - uses: actions/upload-artifact@v4
        with:
          name: lossy27-quality-a100
          path: /tmp/lossy27-bin/
          retention-days: 14
