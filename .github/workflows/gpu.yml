name: GPU

# GPU tests on the project's self-hosted GPU machine. Runs only where the repository variable GPU_RUNNER names it (a JSON label list,
# e.g. '["self-hosted","linux","gpu"]'), and never for a pull request from a fork: on main, by hand, or on a same-repository pull
# request labeled "gpu".
on:
  push:
    branches: [main]
    paths: ['glyd-engine/**', 'gpu/**', 'glyd-gpu/**', 'Cargo.lock', 'scripts/ci_gpu_build.sh', 'scripts/ci_restore_mtimes.py', '.github/workflows/gpu*.yml', 'tests/clients/**']
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      model:
        type: string
        default: google/gemma-4-12B-it:wren

permissions:
  contents: read

# Per pull request: a newer push to a pull request cancels its own older run, never another pull request's (they wait for the one GPU runner). Adding a label other than
# `gpu` starts a run that does nothing (the job's `if` is false); it gets a group of its own so that it does not cancel the pull request's run that is on the GPU.
concurrency:
  group: gpu-${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'gpu') && (github.event.pull_request.number || github.ref) || format('skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  self-hosted:
    if: >-
      vars.GPU_RUNNER != '' && (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'gpu') && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'gpu')))
    uses: ./.github/workflows/gpu-tests.yml
    with:
      runner: ${{ vars.GPU_RUNNER }}
      archs: ${{ vars.GPU_RUNNER_ARCHS || '89' }}
      model: ${{ inputs.model || 'google/gemma-4-12B-it:wren' }}
