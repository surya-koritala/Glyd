name: Hugging Face
# Manual only. The HUGGINGFACE token stays in the "hugging face" environment and this job; nothing prints it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "whoami: the token's account and its organizations; card: publish huggingface/org-card.md as the organization's card; publish: pack a model on the CPU, verify it, and upload it to glyd/NAME-LEVEL; model-card: make glyd/NAME-LEVEL's card again (huggingface/model_card.py) and upload it alone"
        type: choice
        options: [whoami, card, publish, model-card, publish-s3]
        default: whoami
      org:
        description: "The Hugging Face organization (card)"
        type: string
        default: ""
      model:
        description: "publish, model-card: a Hugging Face repo id"
        type: string
        default: "Qwen/Qwen3.5-9B"
      revision:
        description: "publish, model-card: its commit"
        type: string
        default: "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
      layout:
        description: "publish, model-card: the level (penguin: lossless; kestrel: 6-bit; swift: 5-bit)"
        type: choice
        options: [penguin, kestrel, swift]
        default: penguin
      numbers:
        description: "publish, model-card: a path in the repo of the measured numbers for the card (e.g. cards/Qwen3.5-9B-swift.json); none: the card has no numbers"
        type: string
        default: ""
      s3:
        description: "publish-s3: the s3:// prefix of a finished glyd-v7 directory in the private bucket (packed and verified on a pod), e.g. s3://glyd-models-712416033631/nemotron-3-super/hbr40/20261010-1138-EST/packed/"
        type: string
        default: ""
      repo:
        description: "publish-s3: the Hub repo to upload it to (glyd/NAME-LEVEL)"
        type: string
        default: ""
      card:
        description: "publish-s3: the card in this repository (cards/NAME-LEVEL.md); its .NOTICE and .LICENSE beside it go up as NOTICE and LICENSE"
        type: string
        default: ""
      prebuilt:
        description: "publish: a release tag of this repository whose assets are the files of a calibrated checkpoint's directory, packed on a pod (tools/cards/calibrated_pack_job.sh; gh release create TAG --prerelease FILES): downloaded and verified here in place of packing the model; its glyd.json must name this model, revision and layout. none: the model is packed here"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: huggingface
  cancel-in-progress: false
jobs:
  hub:
    if: inputs.action == 'whoami' || inputs.action == 'card'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hugging face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Hub
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE }}
          ACTION: ${{ inputs.action }}
          ORG: ${{ inputs.org }}
        run: |
          python3 -m pip install -q "huggingface_hub==0.35.3"
          python3 huggingface/hub.py
  publish:
    if: inputs.action == 'publish'
    runs-on: glyd-pack-4c  # (the org's 4-core larger runner, 150 GB of disk: a 27B model's 55 GB of bf16 and its pack fit)
    timeout-minutes: 150
    environment: hugging face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/cpu-pack
        with:
          model: ${{ inputs.model }}
          revision: ${{ inputs.revision }}
          mode: pack
          layout: ${{ inputs.layout }}
          prebuilt: ${{ inputs.prebuilt }}
      - name: Model card and upload (only after the CPU verify above passed)
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE }}
          LAYOUT: ${{ inputs.layout }}
          NUMBERS: ${{ inputs.numbers }}
        run: |
          set -euo pipefail
          python huggingface/model_card.py ${NUMBERS:+--numbers "$NUMBERS"} packed out/plan.json packed/README.md
          cp packed/README.md out/
          [ ! -d packed/.eval_results ] || cp -r packed/.eval_results out/
          # (the card is in packed/ now: the one upload_folder below is the publish's only Hub commit, card and weights together)
          python - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          m = json.load(open("packed/glyd.json"))
          repo = "glyd/" + m["source"]["repo"].split("/")[-1] + "-" + os.environ["LAYOUT"]
          api = HfApi()
          api.create_repo(repo, exist_ok=True)
          info = api.upload_folder(folder_path="packed", repo_id=repo, commit_message=f"Glyd {os.environ['LAYOUT']} checkpoint of {m['source']['repo']}@{m['source']['revision'][:8]} (glyd {m['glyd']}, {m['format']})")
          print(f"published https://huggingface.co/{repo} ({info.oid})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish
          path: out/
          retention-days: 30
  model-card:
    # The card of a published checkpoint made again from the Hub's copy (its glyd.json and safetensors headers) and the plan, and uploaded alone: no weights move.
    if: inputs.action == 'model-card'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hugging face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyTorch (CPU), transformers, safetensors, huggingface_hub (the plan's)
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install --quiet "transformers==5.18.0" "safetensors>=0.8" "huggingface_hub>=1.5,<2" "accelerate>=1.1"
      - name: The card, and its upload
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE }}
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
          LAYOUT: ${{ inputs.layout }}
          NUMBERS: ${{ inputs.numbers }}
          PYTHONPATH: ${{ github.workspace }}/glyd-gpu-py
        run: |
          set -euo pipefail
          mkdir -p out
          python huggingface/plan.py "$MODEL" out/plan.json --revision "$REVISION"
          REPO="glyd/${MODEL##*/}-$LAYOUT"
          python huggingface/model_card.py ${NUMBERS:+--numbers "$NUMBERS"} "hub:$REPO" out/plan.json out/README.md
          python - "$REPO" <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          repo = sys.argv[1]
          api = HfApi()
          info = api.upload_file(path_or_fileobj="out/README.md", path_in_repo="README.md", repo_id=repo, commit_message="Model card: the model's parameters beside the Hub's count")
          if os.path.isdir("out/.eval_results"):
              api.upload_folder(folder_path="out/.eval_results", path_in_repo=".eval_results", repo_id=repo, commit_message="Eval results: GSM8K and MMLU-Pro as measured")
          print(f"published https://huggingface.co/{repo}/blob/main/README.md ({info.oid})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-card
          path: out/
          retention-days: 30
  publish-s3:
    # A finished directory from the private bucket (a model the CPU runner cannot pack: Nemotron 3 Super at hummingbird, whose experts' codes come from
    # a calibration on GPUs): downloaded with the environment's short-lived keys for the bucket alone, every pack decoded on the CPU against
    # glyd.json's sha256 (glyd-gpu verify), its hand-made card, NOTICE and LICENSE added, and uploaded in one commit.
    if: inputs.action == 'publish-s3'
    runs-on: glyd-pack-4c  # (150 GB of disk: a 48.7 GB directory fits)
    timeout-minutes: 150
    environment: hugging face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: The directory from the bucket
        env:
          S3: ${{ inputs.s3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GLYD_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GLYD_S3_SECRET }}
          AWS_SESSION_TOKEN: ${{ secrets.GLYD_S3_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          case "$S3" in s3://glyd-models-712416033631/*/) ;; *) echo "s3: a prefix of the private bucket, ending in /"; exit 1;; esac
          python3 -m pip install --quiet awscli
          aws configure set default.s3.max_concurrent_requests 64
          aws s3 cp --recursive --only-show-errors "$S3" packed/
          du -sh packed; ls packed
      - name: Verify every pack (glyd-gpu verify)
        run: |
          set -euo pipefail
          cargo build --release -p glyd-gpu
          ./target/release/glyd-gpu verify packed --threads "$(nproc)"
      - name: Card, NOTICE, LICENSE and the upload (only after the verify above passed)
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE }}
          REPO: ${{ inputs.repo }}
          CARD: ${{ inputs.card }}
        run: |
          set -euo pipefail
          case "$REPO" in glyd/*-penguin|glyd/*-kestrel|glyd/*-swift|glyd/*-wren|glyd/*-hummingbird) ;; *) echo "repo: glyd/NAME-LEVEL"; exit 1;; esac
          cp "$CARD" packed/README.md
          base="${CARD%.md}"; [ ! -f "$base.NOTICE" ] || cp "$base.NOTICE" packed/NOTICE; [ ! -f "$base.LICENSE" ] || cp "$base.LICENSE" packed/LICENSE
          python3 -m pip install --quiet "huggingface_hub>=1.5,<2" hf_xet
          python3 - <<'PY'
          import json, os
          from huggingface_hub import HfApi
          m = json.load(open("packed/glyd.json"))
          repo = os.environ["REPO"]
          api = HfApi()
          api.create_repo(repo, exist_ok=True)
          info = api.upload_folder(folder_path="packed", repo_id=repo, commit_message=f"Glyd checkpoint of {m['source']['repo']}@{m['source']['revision'][:8]} (glyd {m['glyd']}, {m['format']})")
          print(f"published https://huggingface.co/{repo} ({info.oid})")
          PY
