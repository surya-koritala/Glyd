name: Kernels compile

on:
  push:
    branches: [main]
    paths: ['glyd-engine/kernels/**', 'glyd-engine/build.rs', 'gpu/*.cu', 'gpu/*.h', '.github/workflows/kernels.yml', 'scripts/check_kernel_regs.py']
  pull_request:
    branches: [main]
    paths: ['glyd-engine/kernels/**', 'glyd-engine/build.rs', 'gpu/*.cu', 'gpu/*.h', '.github/workflows/kernels.yml', 'scripts/check_kernel_regs.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  engine-kernels:
    # the engine's CUDA kernels as a development build has them (kernels/engine.cu, and Qwen3.5's in kernels/qwen35.cu) compiled by nvcc 13 for every architecture a build takes,
    # with no GPU: a kernel that does not compile never reaches one. ptxas's registers and spills of Qwen3.5's kernels on sm_89 are in the log.
    name: The engine's kernels compile (nvcc 13, no GPU)
    runs-on: ${{ vars.CI_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}  # (its own container on either; never the PC for a fork's pull request)
    timeout-minutes: 40
    container:
      image: nvidia/cuda:13.0.3-devel-rockylinux8
      # (a cap on the container's memory, swap included, so that ptxas cannot take the whole machine where this runs on glyd-pc: a global out-of-memory took it down on Nov 20)
      options: --memory=28g --memory-swap=28g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A compile that passed is remembered by the content of the kernels (and this file): a rerun, or a push that changed none of them, skips nvcc.
      - id: memo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5, Node 24
        with:
          path: /tmp/kernels-compiled
          key: kernels-compiled-${{ hashFiles('glyd-engine/kernels/**', 'glyd-engine/build.rs', 'gpu/*.cu', 'gpu/*.h', '.github/workflows/kernels.yml', 'scripts/check_kernel_regs.py') }}
      - name: nvcc for sm_80, 86, 89, 90a, 100 and 120
        if: steps.memo.outputs.cache-hit != 'true'
        env:
          # (nvcc processes at once besides sm_89's: 3 on GitHub's 4 cores; 2 on the owner's PC, which has other jobs' work and benchmarks to leave room for)
          NVCC_JOBS: ${{ runner.environment == 'self-hosted' && '2' || '3' }}
        run: |
          set -e
          dnf install -y -q --disablerepo="cuda*" --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
          source /opt/rh/gcc-toolset-13/enable
          cd glyd-engine/kernels
          # (the six architectures at once, one nvcc each: the runner has the cores for it, and it took the sum of them one after the other)
          nvcc -cubin -O3 -std=c++17 --expt-relaxed-constexpr -arch=sm_89 -Xptxas -v -o /tmp/engine_89.cubin engine.cu > /tmp/ptxas.txt 2>&1 &
          p89=$!
          printf '%s\n' 80 86 90a 100 120 | xargs -P "$NVCC_JOBS" -I{} sh -c 'nvcc -cubin -O3 -std=c++17 --expt-relaxed-constexpr -arch=sm_{} -Xptxas -v -o /tmp/engine_{}.cubin engine.cu > /tmp/ptxas_{}.txt 2>&1 || { cat /tmp/ptxas_{}.txt; exit 1; }'
          wait "$p89" || { cat /tmp/ptxas.txt; exit 1; }
          # A kernel past 64 registers a thread names its block size, on every architecture: a 1,024-thread launch of one that doesn't fails
          # ("too many resources requested for launch"). sm_120's compiler gave g4_add_norm 80 (sm_89's 53), and an RTX 5060 Ti could not run Gemma 4.
          for a in 89 80 86 90a 100 120; do f=/tmp/ptxas_$a.txt; [ "$a" = 89 ] && f=/tmp/ptxas.txt; echo "sm_$a:"; /usr/libexec/platform-python ../../scripts/check_kernel_regs.py "$f" . || bad=1; done
          [ -z "$bad" ]
          grep -A3 -E "entry function '(rmsnorm1p|rmsnorm1p_add|q35_prep|attn256|attn256_split|attn256_merge|conv_silu|gdn_recurrent|gdn_chunk|gated_norm|small_linear)'" /tmp/ptxas.txt || true
          mkdir -p /tmp/kernels-compiled && date -u > /tmp/kernels-compiled/at
      - name: The workspace back to the runner's user (the container wrote it as root; the PC's next job cleans it as that user)
        if: always() && runner.environment == 'self-hosted'
        # (the temp folder too: the runner cleans it as its user before the next job, and leaves it where it cannot)
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
