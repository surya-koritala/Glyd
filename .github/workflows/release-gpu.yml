name: Release (GPU and engine)

# glyd-gpu's wheels. On a pushed v* tag: build the CUDA libraries (CUDA 12 and 13, on each architecture) and Glyd's engine (glyd-engine, the release build
# of the Rust program, with its CUDA 13 kernels), build the compiled wheel of each
# architecture for Linux (x86_64 and aarch64: glibc 2.28, manylinux_2_28; the stable ABI of CPython 3.10, cp310-abi3, which every CPython from
# 3.10 on takes) with the libraries and the engine's program in it, install it in every CPython from 3.10 to 3.14 and test it there, and publish the wheels to PyPI
# by trusted publishing: pypi.org trusts this workflow file in the `pypi` environment of this repository, so there is no token.
#
# Run by hand (gh workflow run release.yml --ref BRANCH [-f pythons="3.12"]): the same builds and checks of that branch (or of a tag
# that is not v*), kept as the run's artifacts. Only a v* tag publishes, pushed or run by hand on the tag (--ref vX.Y.Z): `publish` does
# not run for anything else, and the `pypi` environment accepts v* tags alone. The plan job decides what is built: a tag must exist,
# be on main or a release-X.Y.Z branch, the version files must say its version (scripts/bump_version.py --check TAG), and CI (ci.yml)
# must have succeeded on its exact commit in a push or a run by hand (a pull request's run tests a merge, not the commit); every later
# job builds the commit it names. Tag a commit after its CI passed (scripts/release_ready.sh VERSION says), an rc too: tag a main
# commit whose own CI run passed. A tag whose commit has no passed run fails here: run CI on the tag (gh workflow run ci.yml --ref
# vX.Y.Z), then re-run this run (gh run rerun RUN). In an emergency only, a run by hand on the tag with -f untested_ok=true releases
# it without CI's success, and says so in a warning; that publishes on one person's say-so, as a pushed tag always could.
#
# Permissions: read everywhere (`plan` also reads the Actions runs, actions: read, in a step that runs nothing of the tag's tree).
# `publish` has id-token: write, and runs only the wheels' download and PyPI's action: no source tree, no build tool, no secret; `sign-engine` (id-token and attestations: write) runs only the
# sign-release action on the engine bundles as built (provenance, SBOM and Sigstore signatures: docs/verify-releases.md).
# Every action is a commit, with its version in the comment. The CUDA builds take about an hour of runner time: a run by hand takes `pythons` to test the wheels on fewer CPythons.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pythons:
        description: "CPython versions to install and test the wheels on, separated by spaces (3.10 3.11 3.12 3.13 3.14); a tag tests all of them"
        required: false
        default: "3.10 3.11 3.12 3.13 3.14"
      untested_ok:
        description: "Emergencies only, run on a tag (--ref vX.Y.Z): release it although CI has not succeeded on its commit"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # the build tools the wheels are made with (ci.yml has the same)
  BUILD_TOOLS: "build==1.6.1 wheel==0.48.0 setuptools==84.0.0 Cython==3.3.0"

jobs:
  plan:
    # What this run builds (a commit, not a ref: a tag can move between jobs), the Pythons it tests on, and whether it publishes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # CI's runs on the tag's commit
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      pythons: ${{ steps.plan.outputs.pythons }}
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # every branch and tag: which branches hold the tag's commit
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_PYTHONS: ${{ github.event.inputs.pythons }}
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$*"; exit 1; }
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag=""; if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then tag="$REF_NAME"; fi ;;
            *) fail "release.yml does not run on $EVENT" ;;
          esac
          if [ -z "$tag" ]; then
            # by hand: this ref as it stands, nothing published
            sha="$GITHUB_SHA"; label="dev-${GITHUB_SHA:0:7}"; publish=false; pythons="${INPUT_PYTHONS:-3.10 3.11 3.12 3.13 3.14}"
            python3 scripts/bump_version.py --check
          else
            [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || fail "$(printf '%q' "$tag") is not a v* version tag"
            git rev-parse -q --verify "refs/tags/$tag^{commit}" > /dev/null || fail "$tag is not a tag of this repository"
            sha=$(git rev-parse "refs/tags/$tag^{commit}")
            on=$(git branch -r --contains "$sha" --format='%(refname:short)' | grep -E '^origin/(main|release-[0-9].*)$' || true)
            [ -n "$on" ] || fail "$tag is at $sha, which is on neither main nor a release-* branch"
            echo "$tag is $sha, on: $(echo "$on" | tr '\n' ' ')"
            git checkout -q --detach "$sha"
            python3 scripts/bump_version.py --check "$tag"
            label="$tag"; publish=true; pythons="3.10 3.11 3.12 3.13 3.14"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "$sha is not a commit"
          json=$(python3 - "$pythons" <<'EOF'
          import json, re, sys
          v = sys.argv[1].split()
          assert v and all(re.fullmatch(r"3\.(10|11|12|13|14)", x) for x in v), f"pythons: {v}: some of 3.10 3.11 3.12 3.13 3.14"
          print(json.dumps(sorted(set(v), key=lambda s: int(s.split(".")[1]))))
          EOF
          )
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "label=$label"
            echo "version=$(grep -m1 '^version = ' glyd-gpu-py/pyproject.toml | cut -d'"' -f2)"
            echo "publish=$publish"
            echo "pythons=$json"
            echo "wheels=2" # (one an architecture)
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: CI passed on the commit
        # A push's or a by-hand run of ci.yml tests the commit itself; a pull request's run tests its merge with main, so it does not count.
        if: steps.plan.outputs.publish == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          TAG: ${{ steps.plan.outputs.tag }}
          UNTESTED_OK: ${{ github.event.inputs.untested_ok }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$*"; exit 1; }
          if [ "$UNTESTED_OK" = true ]; then
            echo "::warning::untested_ok: $TAG ($SHA) is released without CI's success on its commit"; exit 0
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA"
          passed=$(gh api "$runs&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event != "pull_request")] | length') \
            || fail "cannot read CI's (ci.yml) runs on $SHA"
          if ! [[ "$passed" =~ ^[1-9][0-9]*$ ]]; then
            last=$(gh api "$runs&per_page=1" --jq '.workflow_runs[0] // empty | "\(.event) \(.status) \(.conclusion // "-") \(.html_url)"') || last="unreadable"
            fail "CI (ci.yml) has not succeeded on $SHA, $TAG's commit, in a push or a run by hand (its latest run: ${last:-none}). Run it on the tag: gh workflow run ci.yml --ref $TAG; once it has passed, re-run this run: gh run rerun $GITHUB_RUN_ID. In an emergency only, run this workflow by hand on the tag (--ref $TAG) with -f untested_ok=true"
          fi
          echo "CI (ci.yml) succeeded on $SHA"

  gpu-lib:
    # The GPU kernels behind their C API (gpu/build_lib.sh, GLYD_GPU_RELEASE=1: machine code for sm_80, 86, 89, 90a, 100 and 120, no
    # PTX, stripped, the public header's eight functions and glyd_gpu_table exported)
    # for CUDA 12 and 13 on each Linux architecture, once: every wheel of an architecture takes its two. Built on Rocky Linux 8
    # (glibc 2.28) for manylinux_2_28 systems, with GCC 13 from gcc-toolset (its newer libstdc++ parts linked in, as on the manylinux
    # images). Checked here, where cuobjdump is: the architectures and the exports.
    needs: plan
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # the wheels' libraries (device code compressed for size: a driver of CUDA 12.4 or newer reads CUDA 12's) ...
          - {os: ubuntu-latest, name: linux-x86_64, cuda: "12.8.2", compress: size, artifact: gpu-lib}
          - {os: ubuntu-latest, name: linux-x86_64, cuda: "13.0.3", compress: size, artifact: gpu-lib}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, cuda: "12.8.2", compress: size, artifact: gpu-lib}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, cuda: "13.0.3", compress: size, artifact: gpu-lib}
          # ... and the engine bundle's CUDA 12 library, not compressed at all, which a driver of CUDA 12.2 (R535) reads (no size limit on a GitHub release)
          - {os: ubuntu-latest, name: linux-x86_64, cuda: "12.9.1", compress: none, artifact: bundle-lib}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, cuda: "12.9.1", compress: none, artifact: bundle-lib}
    runs-on: ${{ matrix.os }}
    container: nvidia/cuda:${{ matrix.cuda }}-devel-rockylinux8
    env:
      GLYD_GPU_RELEASE: "1"
      GLYD_GPU_COMPRESS: ${{ matrix.compress }}
      GLYD_GPU_NVCC_THREADS: "2" # (the runner has 2 cores and 7 GB: one nvcc thread an architecture would be 6)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Build
        run: |
          set -e
          dnf install -y -q --disablerepo="cuda*" --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils python3.11
          source /opt/rh/gcc-toolset-13/enable
          time bash gpu/build_lib.sh lib
      - name: Check (glibc 2.28, the system's libraries only; the architectures; stripped; the eight functions and the table exported)
        run: |
          set -e
          source /opt/rh/gcc-toolset-13/enable
          for f in lib/*.so; do
            needed=$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
            top() { objdump -T "$f" | grep -oE "$1_[0-9]+(\.[0-9]+)*" | sed "s/$1_//" | sort -uV | tail -1; }
            echo "$f: $(stat -c %s "$f") bytes; needs $needed; GLIBC up to $(top GLIBC), GLIBCXX $(top GLIBCXX), CXXABI $(top CXXABI), GCC $(top GCC)"
            other=$(echo "$needed" | tr ' ' '\n' | grep -vxE 'lib(c|m|dl|pthread|rt)\.so\.[0-9]+|libstdc\+\+\.so\.6|libgcc_s\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[0-9]+' || true)
            [ -z "$other" ] || { echo "$f needs more than the system's libraries: $other"; exit 1; }
            [ "$(printf '%s\n' "$(top GLIBC)" 2.28 | sort -V | tail -1)" = 2.28 ] || { echo "$f needs GLIBC $(top GLIBC), past 2.28"; exit 1; }
            sass=$(cuobjdump --list-elf "$f" | grep -oE 'sm_[0-9]+a?' | sort -u | tr '\n' ' ')
            [ "$sass" = "sm_100 sm_120 sm_80 sm_86 sm_89 sm_90a " ] || { echo "$f has machine code for $sass"; exit 1; }
            ! readelf -S "$f" | grep -qE '\.symtab|\.debug' || { echo "$f is not stripped"; exit 1; }
            echo "$f: machine code for $sass (no PTX), stripped, $(nm -D --defined-only "$f" | wc -l) exports (the eight functions and the table)"
          done
          cd lib && for f in libglyd_gpu_cuda*.so; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-${{ matrix.name }}-cuda${{ matrix.cuda }}
          path: |
            lib/*.so
            lib/*.sha256
          if-no-files-found: error

  engine:
    # Glyd's own engine, glyd-engine (Rust, glyd-engine/): its release build (--no-default-features: none of a development build's commands or tuning variables
    # is compiled in), once for each Linux architecture, with CUDA 13's nvcc for its kernels (GLYD_ENGINE_RELEASE=1: machine code for sm_80, 86, 89, 90a, 100 and
    # 120) and stripped, on Rocky Linux 8 (glibc 2.28) as the libraries are, with the build machine's paths remapped (the cargo and rustup homes). It opens the
    # CUDA driver and the library at run time; nothing else is linked. Checked here: its glibc, its libraries, and that it is stripped. Every wheel of an
    # architecture takes it. Rust 1.98.1 by
    # rustup (the toolchain's own files are checked by rustup against Rust's signed hashes).
    needs: plan
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: ubuntu-24.04-arm, name: linux-aarch64}
    runs-on: ${{ matrix.os }}
    container: nvidia/cuda:13.0.3-devel-rockylinux8
    env:
      GLYD_ENGINE_RELEASE: "1"
      GLYD_SOURCE_COMMIT: ${{ github.sha }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUST_VERSION: "1.98.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Build
        run: |
          set -e
          dnf install -y -q --disablerepo="cuda*" --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils python3.11 curl ca-certificates
          source /opt/rh/gcc-toolset-13/enable
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          source "$HOME/.cargo/env"
          # CUDA 12.9's nvcc beside CUDA 13's (the cuda repository of the image): the engine's kernels are built a second time, not compressed, for drivers that report CUDA 12
          # (NVCC12: build.rs; the binary loads the one the driver's version asks for)
          dnf install -y -q --setopt=install_weak_deps=False cuda-nvcc-12-9 cuda-cudart-devel-12-9
          export NVCC12=/usr/local/cuda-12.9/bin/nvcc
          rustc --version; nvcc --version | tail -2; "$NVCC12" --version | tail -2
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=cargo --remap-path-prefix=$HOME/.rustup=rustup"
          time cargo build --release --locked -p glyd-engine --no-default-features
          mkdir engine && cp target/release/glyd-engine engine/
          # glyd, the one program: the compression program with this engine linked (its `engine` feature takes the engine's library without its development
          # commands, the build just made, so cargo builds only glyd's own code now). The tarball (engine-bundle) holds it, and glyd-engine as a link to it.
          time cargo build --release --locked -p glyd --features engine --bin glyd
          cp target/release/glyd engine/
      - name: Check (glibc 2.28, the system's libraries only; stripped)
        run: |
          set -e
          source /opt/rh/gcc-toolset-13/enable
          for f in engine/glyd-engine engine/glyd; do
            needed=$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
            top() { objdump -T "$f" | grep -oE "$1_[0-9]+(\.[0-9]+)*" | sed "s/$1_//" | sort -uV | tail -1; }
            echo "$f: $(stat -c %s "$f") bytes; needs $needed; GLIBC up to $(top GLIBC)"
            [ "$(printf '%s\n' "$(top GLIBC)" 2.28 | sort -V | tail -1)" = 2.28 ] || { echo "$f needs GLIBC $(top GLIBC), past 2.28"; exit 1; }
            ! readelf -S "$f" | grep -qE '\.symtab|\.debug' || { echo "$f is not stripped"; exit 1; }
          done
          cd engine && sha256sum glyd-engine glyd > glyd-engine.sha256 && cat glyd-engine.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyd-engine-${{ matrix.name }}
          path: |
            engine/glyd-engine
            engine/glyd
            engine/glyd-engine.sha256
          if-no-files-found: error

  engine-bundle:
    # Glyd's engine with its GPU library (CUDA 13), a tarball for each Linux architecture: what install.sh puts beside the compression program on
    # Linux with an NVIDIA GPU, with no Python (GLY-353). The very files the wheels hold (the engine and gpu-lib jobs built and checked them; their
    # sha256 are checked again here); RELEASING.md's step attaches the tarballs and their sha256 to the public repository's release.
    needs: [plan, engine, gpu-lib]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64}
          - {name: linux-aarch64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glyd-engine-${{ matrix.name }}
          path: engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-lib-${{ matrix.name }}-cuda13.0.3
          path: lib
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-lib-${{ matrix.name }}-cuda12.9.1
          path: lib12
      - name: The tarball (glyd with the engine linked, glyd-engine as a link to it, libglyd_gpu_cuda13.so and the not compressed libglyd_gpu_cuda12.so, LICENSE) and its sha256
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          (cd engine && sha256sum -c glyd-engine.sha256)
          (cd lib && sha256sum -c libglyd_gpu_cuda13.so.sha256)
          (cd lib12 && sha256sum -c libglyd_gpu_cuda12.so.sha256)
          d="glyd-engine-v$VERSION-$NAME"
          mkdir -p "out/$d"
          # (the engine loads the library of the driver's CUDA version: 13 from a driver of CUDA 13, else 12; a driver of CUDA 12.2 or newer reads the not compressed 12)
          cp engine/glyd lib/libglyd_gpu_cuda13.so lib12/libglyd_gpu_cuda12.so "out/$d/"
          cp glyd-engine/LICENSE "out/$d/LICENSE"
          chmod +x "out/$d/glyd"
          # (the engine's old command: this program under that name, which it takes for the engine's command line; install.sh and condor/tools/install.sh copy it)
          ln -s glyd "out/$d/glyd-engine"
          tar -C out --owner=0 --group=0 -czf "out/$d.tar.gz" "$d"
          (cd out && sha256sum "$d.tar.gz" > "$d.tar.gz.sha256" && cat "$d.tar.gz.sha256" && tar -tzvf "$d.tar.gz")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-bundle-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error

  engine-windows:
    # glyd.exe for Windows x86_64: the compression program with Glyd's engine linked (the `engine` feature), built with CUDA 13.0.3's nvcc and CUDA 12.9.1's (NVCC12: the kernels a driver of
    # CUDA 12 loads), and the GPU library DLLs of both (libglyd_gpu_cuda13.dll, and libglyd_gpu_cuda12.dll not compressed). The CUDA toolkits are NVIDIA's network installers, checked against
    # the sha256 written here (and NVIDIA's md5); nothing of the toolkit ships (the DLLs link the CUDA runtime in; the engine opens nvcuda.dll). Built here, not run: no runner has a GPU.
    # The zip and its sha256 are attached to the release by attach-engine when the build succeeded; a failure here does not hold the Linux bundles back.
    # (windows-2022: its Visual Studio 2022 is the host compiler CUDA 13.0 and 12.9 list; windows-latest has Visual Studio 2026, whose STL asks for CUDA 13.4 or newer)
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      GLYD_ENGINE_RELEASE: "1"
      GLYD_GPU_RELEASE: "1"
      RUST_VERSION: "1.98.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: The CUDA toolkits (13.0.3 and 12.9.1), nvcc and the runtime's libraries
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(
            @{ v = '13.0.3'; sha = '6b544a8cfea2ca18cc816dacda92064dcf821a201b35185e6c14ca17ccbc026f' },
            @{ v = '12.9.1'; sha = 'de45c336ab4e9825018b546357dc9de5ded9f89c4f5200ef52b8eeac3b1b4072' }
          )
          foreach ($i in $installers) {
            $exe = "cuda_$($i.v)_windows_network.exe"
            Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$($i.v)/network_installers/$exe" -OutFile $exe
            if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $i.sha) { throw "$exe is not the installer this workflow was written for" }
            $p = Start-Process -FilePath ".\$exe" -ArgumentList '-s' -Wait -PassThru
            "$exe exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$exe failed" }
          }
          Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' | Select-Object Name
      - name: Build (MSVC's environment, both nvcc, the engine and glyd.exe, the two DLLs)
        run: |
          $ErrorActionPreference = 'Stop'
          # the MSVC compiler nvcc takes as its host compiler: the environment of vcvars64
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object { if ($_ -match '^(.*?)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] } }
          # (the runner's Visual Studio can be newer than the one a CUDA release lists: the build is checked by what it makes, not by nvcc's list)
          $env:NVCC_APPEND_FLAGS = '-allow-unsupported-compiler'
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          $nvcc13 = "$cuda\v13.0\bin\nvcc.exe"; $nvcc12 = "$cuda\v12.9\bin\nvcc.exe"
          & $nvcc13 --version | Select-Object -Last 2; & $nvcc12 --version | Select-Object -Last 2
          rustup toolchain install $env:RUST_VERSION --profile minimal --no-self-update
          rustup default $env:RUST_VERSION
          $env:NVCC = $nvcc13; $env:NVCC12 = $nvcc12
          $env:GLYD_SOURCE_COMMIT = '${{ needs.plan.outputs.sha }}'
          cargo build --release --locked -p glyd-engine --no-default-features
          if ($LASTEXITCODE) { throw 'cargo build glyd-engine failed' }
          cargo build --release --locked -p glyd --features engine --bin glyd
          if ($LASTEXITCODE) { throw 'cargo build glyd failed' }
          New-Item -ItemType Directory -Force lib13, lib12 | Out-Null
          $env:PATH = "$cuda\v13.0\bin;$env:PATH"
          $env:GLYD_GPU_COMPRESS = 'size'
          & .\gpu\build_lib.ps1 -Out (Resolve-Path lib13)
          $env:PATH = "$cuda\v12.9\bin;$($env:PATH -replace [regex]::Escape("$cuda\v13.0\bin;"), '')"
          $env:GLYD_GPU_COMPRESS = 'none'
          & .\gpu\build_lib.ps1 -Out (Resolve-Path lib12)
          Get-ChildItem lib13, lib12, target\release\glyd.exe | Select-Object FullName, Length
      - name: Check (the program starts; the system's DLLs alone; the DLLs export the C API) and the zip
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target\release\glyd.exe'
          & $exe --version
          if ($LASTEXITCODE) { throw 'glyd.exe does not start' }
          # imports: the system's DLLs only (the C runtime is linked in: .cargo/config.toml)
          $dumpbin = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe | Select-Object -First 1).FullName
          $deps = & $dumpbin /dependents $exe | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim().ToLower() }
          $deps
          $other = $deps | Where-Object { $_ -notmatch '^(kernel32|user32|advapi32|ws2_32|bcrypt|ntdll|userenv|shell32|ole32|oleaut32|crypt32|secur32|ncrypt|msvcrt|api-ms-win-.*|iphlpapi|dbghelp|gdi32|winmm|setupapi|cfgmgr32|rpcrt4|shlwapi|version|wintrust|ucrtbase|normaliz|psapi|propsys|mswsock|dnsapi|netapi32|bcryptprimitives|cabinet)\.dll$' }
          if ($other) { throw "glyd.exe imports more than the system's DLLs: $other" }
          foreach ($dll in 'lib13\libglyd_gpu_cuda13.dll', 'lib12\libglyd_gpu_cuda12.dll') {
            $exports = & $dumpbin /exports $dll | Out-String
            foreach ($f in 'glyd_gpu_api_version', 'glyd_gpu_error_string', 'glyd_gpu_cuda_version') { if ($exports -notmatch $f) { throw "$dll does not export $f" } }
          }
          $d = "glyd-engine-v$($env:VERSION)-windows-x86_64"
          New-Item -ItemType Directory -Force "out\$d" | Out-Null
          Copy-Item $exe "out\$d\glyd.exe"; Copy-Item $exe "out\$d\glyd-engine.exe"
          Copy-Item lib13\libglyd_gpu_cuda13.dll, lib12\libglyd_gpu_cuda12.dll "out\$d\"
          Copy-Item glyd-engine\LICENSE "out\$d\LICENSE"
          Compress-Archive -Path "out\$d" -DestinationPath "out\$d.zip"
          $h = (Get-FileHash "out\$d.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $d.zip" | Set-Content -NoNewline "out\$d.zip.sha256"
          Get-Content "out\$d.zip.sha256"; Get-ChildItem out | Select-Object Name, Length
          # the installer (scripts/install.ps1) on this zip, from a folder (GLYD_RELEASE_URL): it installs, finds the DLLs, and `glyd doctor` on a runner with no GPU says so in words
          $env:GLYD_VERSION = $env:VERSION; $env:GLYD_RELEASE_URL = (Resolve-Path out).Path; $env:GLYD_HOME = Join-Path $PWD 'install-test'; $env:GLYD_NO_PATH = '1'
          & .\scripts\install.ps1
          foreach ($f in 'glyd.exe', 'glyd-engine.exe', 'libglyd_gpu_cuda13.dll', 'libglyd_gpu_cuda12.dll', 'LICENSE-engine') {
            if (-not (Test-Path (Join-Path $env:GLYD_HOME $f))) { throw "the installer did not put $f in $env:GLYD_HOME" }
          }
          $v = & (Join-Path $env:GLYD_HOME 'glyd.exe') --version | Out-String
          if ($v -notmatch [regex]::Escape($env:VERSION)) { throw "the installed glyd says: $v" }
          $doctor = & (Join-Path $env:GLYD_HOME 'glyd.exe') doctor 2>&1 | Out-String
          $doctor
          if ($doctor -notmatch 'NVIDIA|GPU') { throw 'glyd doctor says nothing of the GPU' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-bundle-windows-x86_64
          path: |
            out/*.zip
            out/*.zip.sha256
          if-no-files-found: error

  wheels:
    # One wheel for each architecture, for every CPython from 3.10 on (the stable ABI): every module compiled (Cython), the two libraries of the
    # architecture, the engine's program, the public header. Built in the manylinux_2_28 image (AlmaLinux 8, glibc 2.28) by CPython 3.10, the floor of its ABI, tagged
    # after auditwheel has looked at it, listed, then installed in a fresh environment of each CPython the plan lists, and
    # tested there.
    needs: [plan, gpu-lib, engine]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, os: ubuntu-latest, name: linux-x86_64}
          - {arch: aarch64, os: ubuntu-24.04-arm, name: linux-aarch64}
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gpu-lib-${{ matrix.name }}-*
          path: libs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glyd-engine-${{ matrix.name }}
          path: engine
      - name: Build
        run: |
          set -euo pipefail
          py=/opt/python/cp310-cp310/bin/python
          "$py" --version
          ls -l libs engine
          read -ra tools <<< "$BUILD_TOOLS"
          "$py" -m pip install --quiet "${tools[@]}"
          PATH="$(dirname "$py"):$PATH" GLYD_GPU_LIBS="$PWD/libs" GLYD_GPU_ENGINE="$PWD/engine/glyd-engine" GLYD_GPU_BUILD_ARGS=--no-isolation bash glyd-gpu-py/build.sh
      - name: "Tag (auditwheel: at most manylinux_2_28)"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          py=/opt/python/cp310-cp310/bin/python
          cd glyd-gpu-py/dist
          auditwheel show ./*.whl | tee ../../auditwheel.txt
          # The oldest tag the wheel's files allow: at most manylinux_2_28 (or an older alias).
          tag=$(grep -oE 'platform tag: "[^"]+"' ../../auditwheel.txt | head -1 | sed 's/.*"\(.*\)"/\1/')
          v=$(echo "$tag" | sed -n 's/^manylinux_\([0-9]*\)_\([0-9]*\)_.*/\1.\2/p')
          case "$tag" in manylinux1_*|manylinux2010_*|manylinux2014_*) v=2.17 ;; esac
          [ -n "$v" ] && [ "$(printf '%s\n' "$v" 2.28 | sort -V | tail -1)" = 2.28 ] || { echo "the wheel needs $tag, past manylinux_2_28"; exit 1; }
          "$py" -m wheel tags --platform-tag "manylinux_2_28_$ARCH" --remove ./*.whl
          ls -l
          [ "$(ls)" = "glyd_gpu-$VERSION-cp310-abi3-manylinux_2_28_$ARCH.whl" ] || { echo "the wheel is not glyd_gpu-$VERSION-cp310-abi3-manylinux_2_28_$ARCH.whl"; exit 1; }
      - name: What the wheel holds
        run: /opt/python/cp310-cp310/bin/python -m zipfile -l glyd-gpu-py/dist/*.whl
      - name: Test the wheel in every CPython the plan lists (a fresh environment each, nothing of the checkout on the path)
        env:
          PYTHONS: ${{ needs.plan.outputs.pythons }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for v in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$PYTHONS"); do
            echo "::group::CPython $v"
            py=/opt/python/cp${v/./}-cp${v/./}/bin/python
            "$py" --version
            rm -rf /tmp/t && "$py" -m venv /tmp/t
            /tmp/t/bin/python -m pip install --quiet glyd-gpu-py/dist/*.whl
            (cd glyd-gpu-py/tests && /tmp/t/bin/python test_gpu.py)
            # from outside the source tree, so it is the installed wheel that is looked at
            (cd / && /tmp/t/bin/python -I "$OLDPWD/glyd-gpu-py/check_install.py" "$VERSION")
            /tmp/t/bin/python -m glyd_gpu --help | head -5
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.name }}
          path: glyd-gpu-py/dist/*.whl
          if-no-files-found: error

  collect:
    # Every wheel of every architecture and Python, together: the count the plan asked for, all of this version, and what PyPI refuses
    # at upload (twine check --strict: the metadata and the README). What it keeps is what `publish` uploads, and what a run by hand
    # leaves as its artifact.
    needs: [plan, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Every wheel there, and what PyPI refuses
        env:
          WANT: ${{ needs.plan.outputs.wheels }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ls -l wheels
          all=(wheels/*) mine=(wheels/glyd_gpu-"$VERSION"-*.whl)
          [ "${#all[@]}" = "$WANT" ] || { echo "expected $WANT wheels, found ${#all[@]}"; exit 1; }
          [ "${#mine[@]}" = "$WANT" ] || { echo "not all of them are glyd_gpu-$VERSION wheels"; exit 1; }
          python -m pip install --quiet "twine==7.0.0"
          twine check --strict wheels/*.whl
          # PyPI refuses a file over 100 MB (glyd-gpu's limit): v0.33.0's wheels were 181 MB and v0.33.0 never reached PyPI
          for w in wheels/*.whl; do
            size=$(stat -c %s "$w"); echo "$w: $size bytes"
            [ "$size" -lt 95000000 ] || { echo "$w is $size bytes: PyPI's limit is 100 MB (95 MB here, to keep room)"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyd-gpu-wheels
          path: wheels/*.whl
          if-no-files-found: error

  publish:
    # Trusted publishing: pypi.org trusts this workflow file in the `pypi` environment, whose deployment rule lets v* tags alone in. Runs
    # only for a v* tag (pushed, or a run by hand on the tag; never for a run by hand on a branch), once every wheel is built, checked and collected. The one job with
    # id-token: write; it has no source tree, no build tool and no secret.
    needs: [plan, collect]
    if: needs.plan.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glyd-gpu-wheels
          path: wheels
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels/
          skip-existing: true

  sign-engine:
    # Provenance, an SBOM and keyless signatures of the engine bundles that attach-engine puts on the release (.github/actions/sign-release): with id-token: write besides `publish`;
    # it builds nothing and runs pinned actions on the bundles as they are. docs/verify-releases.md says how to check them.
    # (on every run, a build-only dispatch included: that is the dry run of the signing, whose files are the run's artifacts)
    # The Windows zip (engine-windows, artifact engine-bundle-windows-x86_64) is signed with them where that job succeeded; its failure does not stop the Linux bundles'.
    needs: [plan, engine-bundle, engine-windows]
    if: ${{ always() && needs.engine-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-bundle-*
          path: bundles
          merge-multiple: true
      - uses: ./.github/actions/sign-release
        with:
          dir: bundles
          sums: SHA256SUMS-engine
          sbom: glyd-engine-${{ needs.plan.outputs.label }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-signatures
          path: |
            bundles/SHA256SUMS-engine
            bundles/*.sigstore.json
            bundles/*.spdx.json

  attach-engine:
    # The engine bundles (engine-bundle: glyd with the engine linked, glyd-engine as a link to it, libglyd_gpu_cuda13.so, LICENSE, a tarball for each Linux architecture, and its sha256) attached to this
    # repository's GitHub release of the tag: what install.sh and condor/tools/install.sh download on Linux with an NVIDIA GPU. release.yml makes the release
    # (its attach job); this job waits up to 30 minutes for it, then uploads, replacing assets of the same name.
    # The Windows zip (engine-windows: glyd.exe, the two GPU library DLLs; attested and signed like the tarballs, but not code-signed: P13) goes up with them where that job succeeded; its failure does not hold the Linux bundles back.
    needs: [plan, engine-bundle, sign-engine, engine-windows]
    if: ${{ always() && needs.plan.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v') && needs.engine-bundle.result == 'success' && needs.sign-engine.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-bundle-*
          path: bundles
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-signatures
          path: bundles
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l bundles
          (cd bundles && for f in *.tar.gz *.zip; do [ -e "$f" ] && sha256sum -c "$f.sha256"; done)
          for i in $(seq 1 60); do gh release view "$TAG" -R "$REPO" > /dev/null 2>&1 && break; echo "waiting for release $TAG ($i)"; sleep 30; done
          gh release upload "$TAG" -R "$REPO" --clobber bundles/*.tar.gz bundles/*.tar.gz.sha256 bundles/SHA256SUMS-engine bundles/*.sigstore.json bundles/*.spdx.json
          if ls bundles/*.zip > /dev/null 2>&1; then gh release upload "$TAG" -R "$REPO" --clobber bundles/*.zip bundles/*.zip.sha256; fi
