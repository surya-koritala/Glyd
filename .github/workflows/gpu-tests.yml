name: GPU tests (reusable)

# The engine and the GPU library built for the runner's GPU, the kernel checks that need no model, a small model end to end, and every family's logits against its stored reference.
# Called by gpu.yml (the self-hosted GPU machine) and gpu-cloud.yml (an ephemeral cloud GPU instance).
on:
  workflow_call:
    inputs:
      runner:
        description: runs-on, as JSON (a label list)
        type: string
        required: true
      archs:
        description: GLYD_ENGINE_ARCHS for this GPU (e.g. "89"; "86"; "90a")
        type: string
        default: "89"
      model:
        type: string
        default: google/gemma-4-12B-it:wren
      client_model:
        description: the model served for the client checks (a lossy level of a model released in the last six months)
        type: string
        default: google/gemma-4-12B-it:kestrel

permissions:
  contents: read

jobs:
  gpu:
    name: GPU (sm_${{ inputs.archs }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 90
    container:
      image: nvidia/cuda:13.0.3-devel-ubuntu24.04
      # (a named volume keeps the Hub cache, cargo's registry and the build between runs on a persistent machine)
      options: --gpus all -v glyd-ci-cache:/cache --memory=28g --memory-swap=28g
    env:
      HF_HOME: /cache/hf
      CARGO_HOME: /cache/cargo
      RUSTUP_HOME: /cache/rustup                  # (the toolchain too: else every run downloads it)
      CARGO_TARGET_DIR: /cache/target-sm${{ inputs.archs }}
      GLYD_ENGINE_ARCHS: ${{ inputs.archs }}
      NVCC: /usr/local/cuda/bin/nvcc
      CARGO_PROFILE_RELEASE_LTO: "false"          # (CI builds: no fat LTO, many codegen units; release builds keep both)
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Tools
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential pkg-config curl git ca-certificates python3 python3-venv > /dev/null
          [ -x "$CARGO_HOME/bin/cargo" ] || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          nvidia-smi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The checkout's files get the times their content last changed (so cargo builds what changed, not the checkout)
        run: python3 scripts/ci_restore_mtimes.py "/cache/mtimes-sm${{ inputs.archs }}.json"
      - name: Build the engine (development build, kernels for sm_${{ inputs.archs }}) and the GPU library
        run: bash scripts/ci_gpu_build.sh
      - name: Kernel checks (no model)
        run: |
          "$E" --version
          "$E" bandwidth
          "$E" topkcheck
          "$E" kvshapes
          "$E" kcheck35
          # (the attention kind's kernels, every family's head width and arithmetic, against an fp64 attention: prompt rows on the tensor cores and a warp a head, decode rows in parts)
          "$E" attncheck
          # (each layer kind of the recent families' random models on this GPU against its CPU f32 reference, kind by kind: runtime/reference/mod.rs's table)
          "$E" kindcheck
          # (a random Gemma 4 in 12-bit KV pages: the prompt's tokens read back the plain bf16 cache's values bit for bit, the same first token)
          "$E" kv12check --case gemma4
          # (the scheduler on 12-bit pages, then with pools made too small for four at once: void pages taken back and run again, every reply the one alone)
          "$E" usercheck gemma4 --users 4 --kv12
          GLYD_KV12_SHIFT=60 GLYD_KV12_POOL=1,40 "$E" usercheck gemma4 --users 4 --kv12
      # (its layers are toy ones: tens of megabytes of weights and scratch a case. The GPU's memory is sampled while it runs, the peak printed, and a peak of more than 12,000 MiB of the card's 16,376 fails it:
      # the margin a 16 GB card needs for the driver and the next step)
      - name: Every pack format in tests/data/packs decodes on this GPU to its release's sha256 and its recorded logits (packcheck.rs)
        run: |
          # (the row and codebook layouts on the CPU, as verify does)
          cargo build --release --locked -p glyd-gpu --bin glyd-gpu
          for d in tests/data/packs/*/; do
            "$CARGO_TARGET_DIR/release/glyd-gpu" verify "$d" --device cuda:0
          done
          # (each save that holds the tiny Qwen3, its packs decoded by the GPU library, on the CPU reference against its digest in glyd-engine/tests/packs)
          "$E" packcheck --gpu
      - name: MoE kernel checks (blocking; the peak GPU memory is printed and held under 12,000 MiB)
        run: |
          base=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1)
          ( while :; do nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1; sleep 0.2; done > /tmp/moecheck-mem.txt ) &
          sampler=$!
          status=0
          "$E" moecheck || status=$?
          kill "$sampler" 2>/dev/null || true
          peak=$(sort -n /tmp/moecheck-mem.txt | tail -1)
          echo "moecheck peak GPU memory: ${peak:-unknown} MiB (${base} MiB before it) of the card's 16376 MiB"
          [ "$status" = 0 ]
          [ -n "$peak" ] && [ "$peak" -lt 12000 ]
      - name: ${{ inputs.model }} end to end
        run: |
          out=$("$E" run "${{ inputs.model }}" --prompt "What is 17 + 25? Answer with the number only." --no-think)
          echo "$out"
          echo "$out" | grep -q 42
      - name: The plan is what loads (${{ inputs.model }}; fit on this GPU, the plan run took, and the GPU's memory the load used)
        run: |
          "$E" fit "${{ inputs.model }}" --json > /tmp/fit.json
          cat /tmp/fit.json
          GLYD_PLAN_REPORT=/tmp/loaded.json "$E" run "${{ inputs.model }}" --prompt "Say hello." --no-think > /dev/null
          python3 scripts/ci_plan_check.py /tmp/fit.json /tmp/loaded.json
      - name: The OpenAI, Anthropic and Ollama clients and the Open Responses schema against a served ${{ inputs.client_model }} (chat, streams, tools, thinking, JSON schema; tests/clients)
        run: |
          python3 -m venv /tmp/clients && /tmp/clients/bin/pip install -q openai anthropic ollama requests jsonschema
          "$E" serve "${{ inputs.client_model }}" --port 8350 --ctx 8192 > /tmp/serve.log 2>&1 &
          server=$!
          for _ in $(seq 1 900); do
            curl -sf http://127.0.0.1:8350/v1/models > /dev/null && break
            kill -0 "$server" 2> /dev/null || { cat /tmp/serve.log; exit 1; }
            sleep 2
          done
          status=0
          for client in openai anthropic ollama openresponses; do
            echo "== $client"
            /tmp/clients/bin/python "tests/clients/${client}_check.py" http://127.0.0.1:8350 || status=1
          done
          kill "$server" 2> /dev/null || true
          wait "$server" 2> /dev/null || true
          [ "$status" = 0 ] || tail -40 /tmp/serve.log
          exit "$status"
      - name: Four users at once on a served ${{ inputs.client_model }} through the scheduler (each reply against the same prompt's alone; scripts/ci_concurrent_check.py)
        run: |
          # (prompts one a pass, GLYD_ENGINE_BATCH_PREFILL=0: every reply at once is the reply alone, token for token; then prompts run together: 3 of 4 at least, none failed. --no-draft: a draft model runs one user at a time)
          for mode in same together; do
            if [ "$mode" = same ]; then export GLYD_ENGINE_BATCH_PREFILL=0; args=--same; else unset GLYD_ENGINE_BATCH_PREFILL; args="--least 3"; fi
            "$E" serve "${{ inputs.client_model }}" --port 8351 --ctx 4096 --users 4 --no-draft > /tmp/serve4.log 2>&1 &
            server=$!
            for _ in $(seq 1 900); do
              curl -sf http://127.0.0.1:8351/v1/models > /dev/null && break
              kill -0 "$server" 2> /dev/null || { cat /tmp/serve4.log; exit 1; }
              sleep 2
            done
            status=0
            python3 scripts/ci_concurrent_check.py http://127.0.0.1:8351 --users 4 $args || status=1
            kill "$server" 2> /dev/null || true
            wait "$server" 2> /dev/null || true
            [ "$status" = 0 ] || { tail -40 /tmp/serve4.log; exit 1; }
          done
      - name: Health, readiness, metrics and a graceful drain on a served ${{ inputs.client_model }} (/metrics scraped after real requests; SIGTERM with a reply streaming; tests/ops_check.py)
        run: python3 tests/ops_check.py "$E" "${{ inputs.client_model }}"
      - name: glyd doctor on this GPU (the bundle, every check, the sample plan, nothing secret)
        run: |
          "$E" doctor --bundle /tmp/doctor-bundle.json
          python3 scripts/ci_doctor_check.py /tmp/doctor-bundle.json
      - name: The clients against a random model made here (Qwen3.8's layout, a character-level tokenizer, its chat template; tests/clients/tiny_check.py), whatever its weights write
        run: |
          [ -x /tmp/clients/bin/python ] || python3 -m venv /tmp/clients
          /tmp/clients/bin/pip install -q openai anthropic ollama requests jsonschema langchain-openai langchain-anthropic langchain-ollama
          "$E" logitsmodel qwen35 /tmp/tiny-qwen --servable
          # (the Qwen3.5 layout runs at the lossy levels in this engine)
          "$E" serve /tmp/tiny-qwen:kestrel --port 8351 --ctx 4096 > /tmp/tiny-serve.log 2>&1 &
          server=$!
          for _ in $(seq 1 300); do
            curl -sf http://127.0.0.1:8351/v1/models > /dev/null && break
            kill -0 "$server" 2> /dev/null || { cat /tmp/tiny-serve.log; exit 1; }
            sleep 2
          done
          status=0
          /tmp/clients/bin/python tests/clients/tiny_check.py http://127.0.0.1:8351 || status=1
          kill "$server" 2> /dev/null || true
          wait "$server" 2> /dev/null || true
          [ "$status" = 0 ] || tail -40 /tmp/tiny-serve.log
          exit "$status"
      - name: The 12-bit lossless KV pages of a Llama-style dense model (a random Qwen3 made here, on the executor; kvpages.rs kv12check, logits.rs usercheck --kv12)
        run: |
          "$E" kv12check --case qwen3
          "$E" usercheck qwen3 --users 8 --level penguin --kv12
      - name: The 12-bit lossless KV pages of the latent attention kind (random Kimi-K3 and GLM-5.3-Flash made here; kvpages.rs kv12check, logits.rs usercheck --kv12)
        run: |
          # (a latent is one stream of the pages, its row in heads of 128; its attention reads a sequence's pages unpacked to bf16, so every token reads back and every reply is the bf16 cache's)
          "$E" kv12check --case kimi
          "$E" kv12check --case glm
          "$E" usercheck kimi --users 4 --level penguin --kv12
          "$E" usercheck glm --users 4 --level penguin --kv12
          GLYD_KV12_SHIFT=60 GLYD_KV12_POOL=1,40 "$E" usercheck kimi --users 4 --level penguin --kv12
      - name: Logits of every model family against the stored references (glyd-engine/tests/logits, src/logits.rs)
        run: |
          # (a random model of each family's layout with its layer kinds, made here: only models released in the last six months are used, and those are larger than a 16 GB card holds; a fixture's bound is the
          # reference's KL, or the same bits as the engine's own recorded output on this GPU generation)
          "$E" logitscheck --fixtures glyd-engine/tests/logits
      - name: Each lossy level's KL from penguin against its threshold (Qwen3.5, Gemma 4 and Nemotron-H random models; kestrel, swift, wren; logits.rs levelcheck)
        run: |
          "$E" levelcheck --fixtures glyd-engine/tests/logits
      - name: Several sequences at once on the description executor (random Gemma 4, Qwen3.5-layout, Qwen3, Muse Spark, Kimi-K3 and GLM-5.3 models, each reply against the one-at-a-time reply; logits.rs usercheck)
        run: |
          # (prompts one a pass: every reply at once the reply alone, token for token; prompts together: counted)
          for c in gemma4 qwen35 qwen3 muse kimi glm; do
            GLYD_ENGINE_BATCH_PREFILL=0 "$E" usercheck "$c" --users 4 --level penguin
            # (a round is one step: the rows that decode and the prompts' chunks in one pass; some step holds both. Then at 64 rows a step, and the round of two passes)
            "$E" usercheck "$c" --users 4 --level penguin
            GLYD_ENGINE_STEP_TOKENS=64 "$E" usercheck "$c" --users 4 --level penguin
            GLYD_ENGINE_ONE_STEP=0 "$E" usercheck "$c" --users 4 --level penguin
            # (one sequence's logits by what its step holds beside it, against its row alone: what the other sequences hold changes nothing, and a step of 16 rows or fewer is the row's own
            # pass bit for bit; the larger steps are counted. logits.rs roundcheck)
            "$E" roundcheck "$c"
            # (and where every reply is to be the reply alone: decode steps of up to 64 sequences, not a bit of a row's logits differing from its row alone)
            GLYD_ENGINE_BATCH_PREFILL=0 "$E" roundcheck "$c"
            # (a finished sequence kept in its slot and gone on with, as a conversation's next turn does: against a sequence that ran the same tokens and never ended, bit for bit;
            # through the scheduler, the prompt tokens found and the reply. logits.rs keepcheck)
            "$E" keepcheck "$c"
          done
          # (more users than the dense engine's 8 rows: 16 at once, prompts one a pass)
          GLYD_ENGINE_BATCH_PREFILL=0 "$E" usercheck gemma4 --users 16 --level penguin
          # (and 32: more than the 16 rows whose bits the kernels keep, so their decode steps are two passes; still every reply the reply alone)
          GLYD_ENGINE_BATCH_PREFILL=0 "$E" usercheck gemma4 --users 32 --level penguin
          # (paged keys and values run out: 8 users on 24 blocks a group, each sequence sent back gives its blocks back and runs again; every reply comes, none fails)
          GLYD_ENGINE_PAGES=24 "$E" usercheck gemma4 --users 8 --level penguin
          # (two models in one process, R16: each with its scheduler in a runtime context of its own, a round of one between two rounds of the other; every reply the reply alone, each context's figures its own)
          "$E" twomodels gemma4 qwen35
          "$E" twomodels muse kimi
          # (R1a: a buffer belongs to its context: one of a second context on the GPU written, read, zeroed and freed while the first is current)
          "$E" bufcheck
      - name: Nemotron-H's developer tools on the executor (a random M*ME model made here, nhtoy with and without the decode graph, nhoffload through the expert cache, kcheck_nh.rs)
        run: |
          d="$RUNNER_TEMP/nh"
          rm -rf "$d" && mkdir -p "$d/io"
          "$E" nhrandom "$d/model"
          echo "4 12 6" > "$d/io/toy.txt"
          seq 1 12 > "$d/io/ids.txt"
          "$E" nhtoy "$d/model" "$d/io"
          "$E" nhoffload "$d/model" "$d/io"
          rm -rf "$d"
      - name: The expert cache against every expert on the GPU (R12 and hummingbird; random DeepSeek-V4, GLM-5.3-Flash, Muse Spark and Kimi-K3 models; tiering.rs tiercheck)
        run: |
          # (copy mode: the products over the cache's places are the resident layer's. The same bits where the cache's calls are the resident pass's; where they are not, the differences are printed with --report: tiering.rs says which and why)
          # (DeepSeek-V4's FP4 experts: 4 choices a token over 2 places, so every call is waves, a decode step's too)
          "$E" dsv4random /tmp/v4-tier
          "$E" tiercheck /tmp/v4-tier --places 2
          # (its hummingbird directory: the same bits where every pair of a call has a place; with 2 places the pairs that find none are the host's in copy mode too, and are printed, with the host's own mode beside them)
          "$E" calibrate-experts /tmp/v4-tier /tmp/v4-tier-usage.json --tokens 512 --context 256 --synthetic
          "$E" pack /tmp/v4-tier /tmp/v4-tier-hb --layout hummingbird --usage /tmp/v4-tier-usage.json
          "$E" tiercheck /tmp/v4-tier-hb --places 15 --tokens 6
          "$E" tiercheck /tmp/v4-tier-hb --places 2 --report
          "$E" tiercheck /tmp/v4-tier-hb --places 2 --mode cpu
          # (GLM-5.3-Flash at a block level: its experts in places of the level's layout)
          "$E" glmrandom /tmp/glm-tier
          "$E" tiercheck /tmp/glm-tier --places 2 --layout i6
          # (GLM-5.3-Flash's FP8 experts as released: each packed on its own in places, the heads made the place's; a call's pairs no more than the places. The same bits for a prompt of two tokens; a longer one's last bits are the library's split of K by the call's size)
          "$E" glmrandom /tmp/glm-f8 --fp8
          "$E" tiercheck /tmp/glm-f8 --places 6 --tokens 6
          "$E" tiercheck /tmp/glm-f8 --places 6 --report
          # (Muse Spark's lossless experts: the stack's tiered pack cut per expert, each place its own block entries; glyd_gpu_mma_moe_placed. As the FP8 experts': a call of as many tokens as the places hold)
          "$E" muserandom /tmp/muse-tier
          "$E" tiercheck /tmp/muse-tier --places 6 --tokens 6
          "$E" tiercheck /tmp/muse-tier --places 6 --report
          # (dense layers in the computer's memory, dense_ram.rs: the last two layers' matrices copied into one slot before each runs; the same bits)
          "$E" tiercheck /tmp/muse-tier --places 6 --dense 2 --tokens 6
          "$E" logitsmodel kimi /tmp/kimi-tier
          "$E" tiercheck /tmp/kimi-tier --places 4 --dense 2
      - name: The workspace back to the runner's user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP" 2> /dev/null || echo 1000:1000)" "$GITHUB_WORKSPACE" || true
