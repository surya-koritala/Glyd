name: Tree
# The source tree stays source (scripts/check_tree.sh): on every pull request, merge queue entry and push to main, whatever paths it touches.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
# a pull request's older run is cancelled by its newer one; any other run is a group of its own, so none is cancelled or held back (as ci.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  size:
    name: Tree size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/check_tree.sh
