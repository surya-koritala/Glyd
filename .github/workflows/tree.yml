name: Tree
# The source tree stays source (scripts/check_tree.sh): on every pull request, merge queue entry and push to main, whatever paths it touches.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  size:
    name: Tree size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check_tree.sh
