name: Candidate A compact GPU preparation
on:
  workflow_dispatch:  # (research of Oct 7-10, run by hand: on every pull request it took a fifth of the org's Actions minutes, and Candidate A's 2 GB uploads most of its storage)
permissions:
  contents: read
concurrency:
  group: candidate-a-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Exact compact representation, protocol and field expansion
        run: |
          cargo test --release --manifest-path research/candidate-a-gpu/Cargo.toml
          cargo build --release --manifest-path research/candidate-a-gpu/Cargo.toml --bin fixture
          python3 research/candidate-a-gpu/test_protocol.py research/candidate-a-gpu/target/release/fixture
          python3 -m py_compile research/candidate-a-gpu/*.py
          bash -n research/candidate-a-gpu/pod_job.sh research/candidate-a-gpu/pod_job_a7.sh
          g++ -O2 -std=c++17 -Wall -Wextra -Werror research/candidate-a-gpu/check_expand.cpp -o /tmp/check-expand
          /tmp/check-expand
          python3 research/candidate-a-gpu/outliers.py --record benchmarks/weights/candidate-a-fp8-quality-2026-10-07 --out /tmp/outlier-cases.json
          cmp /tmp/outlier-cases.json research/candidate-a-gpu/outlier-cases.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-a-fixture-builder
          path: research/candidate-a-gpu/target/release/fixture
          retention-days: 14
  fixtures:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-a-fixture-builder
          path: /tmp/builder
      - name: Freeze actual pinned matrix inputs and exact packs
        run: |
          chmod +x /tmp/builder/fixture
          python3 research/candidate-a-gpu/prepare.py --binary /tmp/builder/fixture --out /tmp/prepared-fixtures
          cd /tmp/prepared-fixtures
          tar -cf /tmp/candidate-a-fixtures.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-a-fixtures
          path: /tmp/candidate-a-fixtures.tar
          compression-level: 0
          retention-days: 14
  cuda-build:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: nvidia/cuda:13.0.3-devel-rockylinux8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compiler prerequisites
        run: dnf install -y -q --disablerepo='cuda*' --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils
      - name: Compile first-party compact decoder and products
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-13/enable
          mkdir -p /tmp/candidate-a-gpu
          nvcc -O3 -std=c++20 --expt-relaxed-constexpr -D__CUDA_NO_HALF_OPERATORS__ -D__CUDA_NO_HALF_CONVERSIONS__ -D__CUDA_NO_BFLOAT16_CONVERSIONS__ -D__CUDA_NO_HALF2_OPERATORS__ -gencode arch=compute_80,code=sm_80 -gencode arch=compute_89,code=sm_89 -Xcompiler -fPIC,-fvisibility=hidden -shared -cudart static research/candidate-a-gpu/device.cu -o /tmp/candidate-a-gpu/libcandidate_a.so
          cp research/candidate-a-gpu/device.h /tmp/candidate-a-gpu/
          # Registers, stack and spills of the seven-bit and FP8-variant kernels on SM89 (diagnostic; never fails the build).
          cuobjdump --dump-resource-usage --gpu-architecture sm_89 /tmp/candidate-a-gpu/libcandidate_a.so | grep -A1 -E 'sk8_kernel|Seven16|unpack7' | grep -v '^--' || true
          printf '%s\n' "$GITHUB_SHA" > /tmp/candidate-a-gpu/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-a-gpu-prepared
          path: /tmp/candidate-a-gpu/
          retention-days: 14
  bundle:
    needs: [fixtures, cuda-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-a-gpu-prepared
          path: /tmp/candidate-a-validation
      - uses: actions/download-artifact@v4
        with:
          name: candidate-a-fixtures
          path: /tmp
      - name: Verify prepared bundle in the exact pod image
        run: |
          set -euo pipefail
          tar -xf /tmp/candidate-a-fixtures.tar -C /tmp/candidate-a-validation
          rm /tmp/candidate-a-fixtures.tar
          cp research/candidate-a-gpu/{protocol.py,validate.py,fp8_variant.py,a7_variant.py,environment.py,pod_job.sh,pod_job_a7.sh,VALIDATION.md,outlier-cases.json} /tmp/candidate-a-validation/
          cp research/lossy-2026/pod-image.txt /tmp/candidate-a-validation/
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          IMAGE=$(cat research/lossy-2026/pod-image.txt)
          docker run --rm --entrypoint /bin/bash -v /tmp/candidate-a-validation:/prepared "$IMAGE" -c '
            set -euo pipefail
            export PYTHONNOUSERSITE=1
            unset PYTHONPATH PYTHONHOME LD_LIBRARY_PATH
            python3.12 /prepared/validate.py --bundle /prepared --check-inputs
            python3.12 /prepared/environment.py --library /prepared/libcandidate_a.so --out /prepared/environment.json
            python3.12 -m pip freeze --all > /prepared/environment-freeze.txt
          '
          sudo chown -R "$(id -u):$(id -g)" /tmp/candidate-a-validation
          cd /tmp/candidate-a-validation
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -cf /tmp/candidate-a-validation.tar .
          cd /tmp
          sha256sum candidate-a-validation.tar > candidate-a-validation.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-a-validation
          path: |
            /tmp/candidate-a-validation.tar
            /tmp/candidate-a-validation.tar.sha256
          compression-level: 0
          retention-days: 14
