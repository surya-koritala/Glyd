[package]
name = "glyd"
version = "0.13.0"
edition = "2021"
description = "Compression for the data that fills object storage: logs and dumps as typed columns, packs of small objects, a store that compresses across objects, versions against the last one, and the fastest reads at every ratio"
repository = "https://github.com/surya-koritala/Glyd"
readme = "README.md"
keywords = ["compression", "storage", "s3", "zstd", "deduplication"]
categories = ["compression"]
license = "BSD-3-Clause OR GPL-2.0-only"
exclude = ["corpus/", "benchmarks/", "experiments/", "docs/benchmarks/", "bindings/", "contrib/", "Formula/", "scripts/", ".github/", "glyd-store/"]

[workspace]
members = [".", "glyd-store"]

[features]
default = ["deflate", "jpeg"]
# Deflate containers opened and re-encoded bit for bit (src/deflate.rs)
# and JPEGs transcoded losslessly (src/jpeg.rs): the dependencies, and
# what `--no-default-features` gives up.
deflate = ["dep:preflate-rs"]
jpeg = ["dep:lepton_jpeg"]

[dependencies]
preflate-rs = { version = "0.7", optional = true }
lepton_jpeg = { version = "0.5", optional = true }

# The reference codecs are linked by the benchmark examples and tests
# only; the library and the CLI carry none of them.
[dev-dependencies]
libc = "0.2"
lz4_flex = "0.11"
lz4 = "1.28"
snap = "1.1"
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1.10"
lzav = "0.1.1"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "glyd"
path = "src/bin/glyd.rs"
required-features = ["deflate"]

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = false

[[example]]
name = "fuzz_repro"
path = "examples/fuzz_repro.rs"

[[example]]
name = "decode_one"
path = "examples/decode_one.rs"

[[example]]
name = "field_survey"
path = "examples/field_survey.rs"

[[example]]
name = "ratio_only"
path = "examples/ratio_only.rs"

[[example]]
name = "quick3"
path = "examples/quick3.rs"

[[example]]
name = "huff_probe"
path = "examples/huff_probe.rs"

[[example]]
name = "lzav_decomp"
path = "examples/lzav_decomp.rs"

[[example]]
name = "huff_speed"
path = "examples/huff_speed.rs"

[[example]]
name = "rans_speed"
path = "examples/rans_speed.rs"

[[example]]
name = "speed_ceiling"
path = "examples/speed_ceiling.rs"

[[example]]
name = "token_stats"
path = "examples/token_stats.rs"

[[example]]
name = "floor"
path = "examples/floor.rs"

[[example]]
name = "cfloor"
