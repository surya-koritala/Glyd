[package]
name = "simd-stream-codec"
version = "0.1.0"
edition = "2021"

[dependencies]
lz4_flex = "0.11"
lz4 = "1.28"
snap = "1.1"
zstd = "0.13"
rayon = "1.10"
lzav = "0.1.1"

[dev-dependencies]
libc = "0.2"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "alatirok"
path = "src/bin/alatirok.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = false

[[example]]
name = "fuzz_repro"
path = "examples/fuzz_repro.rs"

[[example]]
name = "decode_one"
path = "examples/decode_one.rs"

[[example]]
name = "stream_stats"
path = "examples/stream_stats.rs"

[[example]]
name = "token_hist"
path = "examples/token_hist.rs"

[[example]]
name = "field_survey"
path = "examples/field_survey.rs"

[[example]]
name = "ratio_only"
path = "examples/ratio_only.rs"

[[example]]
name = "quick3"
path = "examples/quick3.rs"

[[example]]
name = "repeat_offset_stats"
path = "examples/repeat_offset_stats.rs"

[[example]]
name = "entropy_probe"
path = "examples/entropy_probe.rs"
