[package]
name = "glyd"
version = "0.33.0"
edition = "2021"
rust-version = "1.89"
description = "Compression for the data that fills object storage: logs and dumps as typed columns, packs of small objects, a store that compresses across objects, versions against the last one, and the fastest reads at every ratio"
repository = "https://github.com/surya-koritala/Glyd"
readme = "README.md"
keywords = ["compression", "storage", "s3", "zstd", "deduplication"]
categories = ["compression"]
license = "Apache-2.0"
exclude = ["corpus/", "benchmarks/", "docs/benchmarks/", "bindings/", "contrib/", "Formula/", "scripts/", ".github/", "glyd-store/", "gpu/", "glyd-gpu/", "glyd-engine/", "glyd-gpu-py/", "condor/", "starlings/", "research/", "tools/", "cards/", "huggingface/", "ckpt/"]

[workspace]
members = [".", "glyd-store", "glyd-gpu", "glyd-engine"]
# starlings/ is its own workspace (edition 2024, its own pinned toolchain); condor/ has no Rust
exclude = ["starlings", "condor"]

[features]
default = ["deflate", "jpeg"]
# Reading what earlier releases wrote: v0.12-v0.13.3 containers
# (preflate's reconstruction) and v0.13.0-v0.13.4 JPEG streams
# (Lepton's). Everything written today is Glyd's own (src/reflate,
# src/jpg); `--no-default-features` gives up only the old files.
deflate = ["dep:preflate-rs"]
jpeg = ["dep:lepton_jpeg"]
# The JPEG model's bits and decisions per part, printed by its photos test.
jpg-stats = []

[dependencies]
preflate-rs = { package = "glyd-preflate", path = "third_party/preflate-rs", version = "0.7.6", optional = true }
lepton_jpeg = { version = "=0.5.8", optional = true }

# The reference codecs are linked by the benchmark examples and tests
# only; the library and the CLI carry none of them.
[dev-dependencies]
libc = "0.2"
lz4_flex = "0.11"
lz4 = "1.28"
snap = "1.1"
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1.10"
lzav = "0.1.1"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "glyd"
path = "src/bin/glyd.rs"
required-features = ["deflate"]

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = false

# The profile the tests of CI build with (`cargo test --profile ci`): the release build's code (the codec's arithmetic wraps on purpose, so no
# overflow checks) without fat LTO and one codegen unit, which only slow the build of a test binary.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[[example]]
name = "fuzz_repro"
path = "examples/fuzz_repro.rs"

[[example]]
name = "decode_one"
path = "examples/decode_one.rs"

[[example]]
name = "field_survey"
path = "examples/field_survey.rs"

[[example]]
name = "ratio_only"
path = "examples/ratio_only.rs"

[[example]]
name = "quick3"
path = "examples/quick3.rs"

[[example]]
name = "huff_probe"
path = "examples/huff_probe.rs"

[[example]]
name = "lzav_decomp"
path = "examples/lzav_decomp.rs"

[[example]]
name = "huff_speed"
path = "examples/huff_speed.rs"

[[example]]
name = "rans_speed"
path = "examples/rans_speed.rs"

[[example]]
name = "speed_ceiling"
path = "examples/speed_ceiling.rs"

[[example]]
name = "token_stats"
path = "examples/token_stats.rs"

[[example]]
name = "floor"
path = "examples/floor.rs"

[[example]]
name = "cfloor"
path = "examples/cfloor.rs"

[[example]]
name = "fastloop"
path = "examples/fastloop.rs"

[[example]]
name = "mc"
path = "examples/mc.rs"

[[example]]
name = "v7_bench"
path = "examples/v7_bench.rs"

[[example]]
name = "v7_parse"
path = "examples/v7_parse.rs"

# Clippy's findings in the code as of 2026-11-20, allowed by name so CI can deny anything new (`-D warnings`).
# Fix a lint's sites and delete its line here.
[workspace.lints.clippy]
byte_char_slices = "allow"
cast_slice_from_raw_parts = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
doc_lazy_continuation = "allow"
drop_non_drop = "allow"
empty_line_after_doc_comments = "allow"
excessive_precision = "allow"
identity_op = "allow"
implicit_saturating_sub = "allow"
int_plus_one = "allow"
io_other_error = "allow"
items_after_test_module = "allow"
large_enum_variant = "allow"
len_zero = "allow"
manual_checked_ops = "allow"
manual_contains = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_pattern_char_comparison = "allow"
manual_range_contains = "allow"
manual_range_patterns = "allow"
manual_try_fold = "allow"
manual_repeat_n = "allow"
map_identity = "allow"
missing_const_for_thread_local = "allow"
missing_safety_doc = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_range_loop = "allow"
needless_return = "allow"
neg_cmp_op_on_partial_ord = "allow"
new_without_default = "allow"
no_effect_replace = "allow"
op_ref = "allow"
precedence = "allow"
print_literal = "allow"
redundant_closure = "allow"
result_unit_err = "allow"
should_implement_trait = "allow"
suspicious_open_options = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
unnecessary_operation = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
useless_conversion = "allow"
useless_vec = "allow"
while_let_loop = "allow"

[lints]
workspace = true
