[package]
name = "glyd"
version = "0.9.2"
edition = "2021"
description = "Glyd: a SIMD-first lossless codec with LZ4-class, faster-decode and zstd-class (entropy-coded) levels"
repository = "https://github.com/surya-koritala/Glyd"
readme = "README.md"
keywords = ["compression", "lz77", "simd", "entropy-coding"]
categories = ["compression"]
license-file = "LICENSE"

[dependencies]

# The reference codecs are linked by the benchmark examples and tests
# only; the library and the CLI carry none of them.
[dev-dependencies]
libc = "0.2"
lz4_flex = "0.11"
lz4 = "1.28"
snap = "1.1"
zstd = { version = "0.13", features = ["zstdmt"] }
rayon = "1.10"
lzav = "0.1.1"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "glyd"
path = "src/bin/glyd.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = false

[[example]]
name = "fuzz_repro"
path = "examples/fuzz_repro.rs"

[[example]]
name = "decode_one"
path = "examples/decode_one.rs"

[[example]]
name = "field_survey"
path = "examples/field_survey.rs"

[[example]]
name = "ratio_only"
path = "examples/ratio_only.rs"

[[example]]
name = "quick3"
path = "examples/quick3.rs"

[[example]]
name = "huff_probe"
path = "examples/huff_probe.rs"

[[example]]
name = "lzav_decomp"
path = "examples/lzav_decomp.rs"

[[example]]
name = "huff_speed"
path = "examples/huff_speed.rs"

[[example]]
name = "rans_speed"
path = "examples/rans_speed.rs"

[[example]]
name = "speed_ceiling"
path = "examples/speed_ceiling.rs"

[[example]]
name = "token_stats"
path = "examples/token_stats.rs"

[[example]]
name = "floor"
path = "examples/floor.rs"

[[example]]
name = "cfloor"
path = "examples/cfloor.rs"

[[example]]
name = "fastloop"
path = "examples/fastloop.rs"

[[example]]
name = "mc"
path = "examples/mc.rs"

[[example]]
name = "v7_bench"
path = "examples/v7_bench.rs"

[[example]]
name = "v7_parse"
path = "examples/v7_parse.rs"
