[package]
name = "glyd-gpu"
version = "0.27.0-rc.1"
edition = "2021"
description = "Glyd's GPU weights from Rust: the CUDA library's C API loaded at run time (a bf16 model's matrices held compressed in GPU memory, decoded bit for bit, whole or inside their products), and models packed and checked on the CPU (glyd pack, glyd verify)"
repository = "https://github.com/surya-koritala/Glyd"
readme = "README.md"
keywords = ["cuda", "gpu", "compression", "llm", "inference"]
categories = ["compression", "api-bindings"]
license = "BUSL-1.1"

[dependencies]
sha2 = "0.11"
